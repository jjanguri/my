<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>명대사 공유</title>

<style>
/* ───── 전체 화면 기본 ───── */
/* ───── Google Fonts: 아날로그 도서 감성 폰트 (나눔명조 & 마루부리) ───── */
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Maru+Buri:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&family=Song+Myung&family=Nanum+Pen+Script&family=Gaegu:wght@400;700&display=swap');

/* 클래식 종이 질감 배경 생성 */
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  font-family: 'Maru Buri', 'Nanum Myeongjo',serif;
  background-color: #f6f3eb; /* 앤티크 양장본 종이색 */
  background-image: 
    radial-gradient(#e2dad0 0.75px, transparent 0.75px),
    radial-gradient(#e2dad0 0.75px, #f6f3eb 0.75px);
  background-size: 30px 30px;
  background-position: 0 0, 15px 15px;
  color: #2b2623; /* 묵직한 먹색/먹물 느낌 */
  display: flex;
  flex-direction: column;
}

/* 커스텀 스크롤바: 클래식 책책장 분위기 */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #efeae1; }
::-webkit-scrollbar-thumb { background: #c5b8a5; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #a3937d; }

/* ───── 레이아웃 ───── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* 왼쪽 패널: 펼쳐진 책의 왼쪽 페이지 */
.leftPanel {
  flex: 1.5;
  padding: 1.8rem 2rem;
  overflow-y: auto;
  background: transparent;
  display: flex;
  flex-direction: column;
}

/* 오른쪽 패널: 펼쳐진 책의 오른쪽 페이지 (책 제본선 느낌 적용) */
.rightPanel {
  flex: 1; 
  padding: 1.8rem 2rem;
  background: #faf8f3;
  overflow: auto; 
  border-left: 2px solid #e0d8cb;
  box-shadow: inset 10px 0 15px -8px rgba(67, 54, 43, 0.06); /* 책 접힘 음영 */
  display: flex;
  flex-direction: column;
}

/* ───── 공통 타이포그래피 & 요소 ───── */
h2 { 
  color: #1c1816; 
  font-family: 'Nanum Myeongjo', serif; 
  font-weight: 700; 
  margin-bottom: 0.8rem; 
  letter-spacing: -0.5px;
}

input, textarea, button { 
  width: 100%; 
  padding: 0.7rem 0.9rem; 
  margin-top: 0.5rem; 
  border-radius: 4px; /* 옛날 서적 필기노트 느낌의 가벼운 라운딩 */
  border: 1px solid #dcd4c5; 
  background-color: #fffcf7;
  color: #2b2623;
  box-sizing: border-box; 
  font-size: 0.95rem; 
  font-family: 'Maru Buri', serif; 
  transform: none;
  transition: all 0.2s ease;
}

input:focus, textarea:focus {
  outline: none;
  border-color: #8c7355; /* 만년필 잉크 필기 라인 */
  background-color: #ffffff;
  box-shadow: 0 0 0 3px rgba(140, 115, 85, 0.1);
}

#quoteText, .commentInput { 
  overflow: auto; 
  font-family: 'Nanum Myeongjo', serif;
  font-weight: 400; 
  font-size: 1.02rem; 
  line-height: 1.75; 
  resize: none; 
}
#quoteText { flex: 1; min-height: 0; }

button { 
  background: #5c4e43; /* 클래식 가죽 제본 컬러 */
  color: #f7f4ef; 
  border: none; 
  cursor: pointer; 
  transition: 0.2s; 
  font-weight: 500; 
  font-family: 'Noto Sans KR', sans-serif;
  margin-top: 0.8rem; 
  border-radius: 4px; 
  letter-spacing: 0.5px;
}
button:hover { background: #3e332a; }

#refreshBtn { 
  background: #eae2d5; 
  color: #5c4e43; 
  font-size: 0.85rem; 
  margin-top: 0.3rem; 
}
#refreshBtn:hover { background: #dbcfbc; }

/* ───── 명대사 카드: 단행본/에세이 페이지 느낌 ───── */
.quote {
  border-radius: 4px;
  padding: 1.2rem 1.4rem;
  margin-top: 0.8rem;
  background: #fffcf7;
  border: 1px solid #e8e1d3;
  /* 카드 좌측에 책 책등 느낌의 분위기 있는 컬러 바 추가 */
  border-left: 4px solid #a38f78;
  box-shadow: 0 4px 12px rgba(67, 54, 43, 0.04);
  position: relative;
  font-weight: 400;
  font-size: 1rem;
  line-height: 1.8;
  white-space: pre-line;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.quote:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(67, 54, 43, 0.08);
  background: #ffffff;
}

.quote-title { 
  font-family: 'Nanum Myeongjo', serif; 
  font-weight: 700; 
  margin-bottom: 0.5rem; 
  color: #1c1816; 
  white-space: normal; 
  font-size: 1.08rem; 
  letter-spacing: -0.3px;
}

.quote-text { 
  font-family: 'Nanum Myeongjo', serif; 
  font-weight: 400; 
  margin: 0; 
  white-space: pre-wrap; 
  padding: 0 0.2rem; 
  color: #3b332e; 
  letter-spacing: -0.2px;
}

.actionButtons { position: absolute; bottom: 10px; right: 10px; display: flex; gap: 5px; font-size: 0.85rem; }

/* 액션 버튼 공통 */
.actionButtons button {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.78rem;
  padding: 0.3rem 0.6rem;
  border-radius: 3px;
  font-weight: 500;
  width: auto !important;
  height: auto;
  line-height: 1;
  margin: 0;
  flex: none;
  white-space: nowrap;
}

/* 좋아요 버튼 */
.likeBtn {
  background: #fff;
  border: 1px solid #dcd4c5;
  color: #8c8275;
  position: relative;
}
.likeBtn.liked {
  color: #c04e46; /* 말린 장미빛 스탬프 */
  border-color: #e5b3af;
  background: #fdf5f4;
}

/* 모음집 담기 버튼 */
.collectBtn {
  background: #fff;
  border: 1px solid #dcd4c5;
  color: #8c8275;
}
.collectBtn.collected {
  background: #f3ecd9;
  border-color: #c9a15a;
  color: #8c7355;
}

/* 복사 버튼 */
.copyBtn {
  background: #fff;
  border: 1px solid #dcd4c5;
  color: #5c4e43;
}
.copyBtn:hover {
  background: #efeae1;
}

/* 수정 버튼 */
.editBtn {
  background: #8c7355; /* 안티크 우드 */
  color: white;
}

/* 삭제 버튼 */
.deleteBtn {
  background: #a65b55; /* 말린 장미 브라운 */
  color: white;
}

/* 공유 버튼 */
.shareBtn {
  background: #5c4e43;
  color: white;
  font-size: 0.8rem;
}

/* 책 속 책갈피 태그 스타일 */
.tags { margin-top: 0.8rem; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
.tag { 
  display: inline-block; 
  background: #efeae0; 
  color: #5c4e43; 
  padding: 0.2rem 0.6rem; 
  border-radius: 2px; 
  border: 1px solid #e0d7c6;
  cursor: pointer; 
  font-size: 0.78rem; 
  font-family: 'Maru Buri', serif;
}
.tag:hover { background: #e2dacd; color: #1c1816; }

/* 태그 자동완성 드롭다운 */
.tagInputWrapper { position: relative; }

.fontSelect {
  margin-top: 0.5rem;
  padding: 0.5rem 0.6rem;
  font-size: 0.85rem;
  color: #5c4e43;
  background-color: #fffcf7;
  border: 1px solid #dcd4c5;
  border-radius: 4px;
  cursor: pointer;
}
.fontSelect:focus { outline: none; border-color: #8c7355; }
.tag-suggestions {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  margin-top: 2px;
  background: #fffcf7;
  border: 1px solid #dcd4c5;
  border-radius: 4px;
  max-height: 170px;
  overflow-y: auto;
  z-index: 60;
  box-shadow: 0 6px 16px rgba(67, 54, 43, 0.1);
}
.tag-suggestions.active { display: block; }
.tag-suggestion-item {
  padding: 0.45rem 0.8rem;
  cursor: pointer;
  font-size: 0.85rem;
  color: #5c4e43;
  font-family: 'Maru Buri', serif;
}
.tag-suggestion-item:hover,
.tag-suggestion-item.active-hover {
  background: #efeae0;
  color: #1c1816;
}

#quotesList { 
  flex: 1; 
  overflow-y: auto; 
  margin-top: 0.5rem; 
  padding: 0.5rem; 
  border-radius: 4px; 
  background: rgba(234, 226, 213, 0.3); 
}

.commentSection { 
  margin-top: 0.8rem; 
  padding: 0.8rem; 
  background: #f7f3eb; 
  border-radius: 4px; 
  border: 1px dashed #d6cbba; 
  display: none; 
}

.comment { 
  background: #ffffff; 
  padding: 0.6rem 0.8rem; 
  border-radius: 3px; 
  margin-bottom: 0.4rem; 
  font-size: 0.88rem; 
  line-height: 1.5; 
  border: 1px solid #eae2d5; 
  font-family: 'Maru Buri', serif;
}
.comment-user { font-weight: 700; margin-right: 0.3rem; color: #43362d; }
.comment-time { font-size: 0.72rem; color: #9e9282; margin-left: 0.3rem; font-family: 'Noto Sans KR', sans-serif; }

.commentInput { 
  margin-top: 0.4rem; 
  border: 1px solid #dcd4c5; 
  border-radius: 3px; 
  padding: 0.5rem; 
  min-height: 50px; 
}

.commentAddBtn { 
  background: #5c4e43; 
  color: white; 
  border: none; 
  border-radius: 3px; 
  padding: 0.4rem; 
  margin-top: 0.3rem; 
  cursor: pointer; 
  font-weight: 500; 
}
.commentAddBtn:hover { background: #3e332a; }

/* Alert Box */
#alertBox {
  position: fixed;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  background: #3e332a;
  color: #f7f4ef;
  padding: 0.65rem 1.4rem;
  border-radius: 4px;
  display: none;
  z-index: 9999;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  font-family: 'Maru Buri', serif;
}

#alertBox button {
  background: #faf8f3;
  color: #2b2623;
  border: 1px solid #dcd4c5;
  width: auto;
  padding: 0.3rem 0.8rem;
  margin-top: 0;
  display: inline-block;
  transform: translateY(-1px);
}

#alertBox button:hover { background: #efeae1; }
#alertBox span { display: inline-block; }

.smallBtn {
  background: #a65b55;
  color: white;
  font-size: 0.8rem;
  padding: 0.35rem 0.65rem;
  border-radius: 3px;
  font-weight: 500;
  cursor: pointer;
  width: fit-content;
  margin-top: 0;
  font-family: 'Noto Sans KR', sans-serif;
}
.smallBtn:hover { background: #8e4a45; }

/* 오른쪽 패널 헤더 정렬 */
.headerWithButton { display: flex; flex-direction: column; gap: 10px; margin-bottom: 0.8rem; }
.headerTop { display: flex; align-items: center; justify-content: space-between; }
.headerTop h2 { margin: 0; font-size: 1.35rem; }

.headerBtns { display: flex; gap: 6px; align-items: center; width: 100%; }
.headerBtns .smallBtn { margin-top: 0; white-space: nowrap; font-size: 0.8rem; padding: 0.45rem 0.65rem; }
.headerBtns .highlightBtn, .headerBtns button:nth-child(2) { flex: 1; text-align: center; }

.iconOnlyBtn {
  padding: 0.45rem 0.6rem !important;
  background-color: #fffcf7 !important;
  color: #5c4e43 !important;
  border: 1px solid #dcd4c5 !important;
  flex: none;
}
.iconOnlyBtn:hover { background-color: #efeae1 !important; }

/* 관리자 로그인 표시 라벨 */
.adminBadge {
  font-size: 0.75rem;
  padding: 0.25rem 0.5rem;
  background-color: #8c7355;
  color: #fff;
  border-radius: 3px;
  font-family: 'Noto Sans KR', sans-serif;
}

.commentCount { color: #9e9282; margin-left: 0.2rem; white-space: nowrap; }
.commentNumber { font-size: 0.75rem; font-weight: normal; }

.commentEditTextarea {
  width: 100%;
  min-height: 50px;
  max-height: 80px;
  resize: none;
  overflow-y: auto;
  box-sizing: border-box;
  padding: 0.5rem;
  font-size: 0.92rem;
  line-height: 1.5;
  border-radius: 3px;
  border: 1px solid #dcd4c5;
  font-family: 'Maru Buri', serif;
}

.totalCount { font-weight: normal; font-size: 0.85rem; color: #8c8275; margin-left: 0.3rem; font-family: 'Noto Sans KR', sans-serif; }
.listHeader { display: flex; align-items: center; gap: 0.25rem; }

.sortIcon {
  background: none;
  border: none;
  padding: 4px 6px;
  width: auto;
  height: auto;
  font-size: 1rem;
  cursor: pointer;
  opacity: 0.7;
  margin-top: 0;
}
.sortIcon:hover { opacity: 1; transform: scale(1.15); }
.sort-new, .sort-old { color: #8c7355; font-weight: 600; }

mark { background: #f3e1b9; border-radius: 2px; }

/* 공유 모달 (옛날 책 표지 오버레이 스타일) */
.shareOverlay {
  position: fixed;
  inset: 0;
  background: rgba(30, 24, 20, 0.5);
  backdrop-filter: blur(3px);
  z-index: 9998;
}

.shareModal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #faf8f3;
  border-radius: 8px;
  padding: 1.4rem;
  width: 360px;
  max-width: 90%;
  z-index: 9999;
  border: 1px solid #dcd4c5;
  box-shadow: 0 16px 35px rgba(0,0,0,0.2);
}

.shareModal h3 {
  margin: 0 0 0.8rem;
  text-align: center;
  font-family: 'Nanum Myeongjo', serif;
  color: #1c1816;
}

.sharePreview img {
  width: 100%;
  border-radius: 4px;
  margin-bottom: 0.8rem;
  border: 1px solid #e0d7c6;
}

.shareActions { display: flex; gap: 0.5rem; }
.shareActions button { flex: 1; padding: 0.6rem; border-radius: 4px; border: none; cursor: pointer; margin-top: 0; }
.saveImgBtn { background: #5c4e43; color: white; }
.closeShareBtn { background: #eae2d5; color: #5c4e43; }

/* 모음집 담기 / 모음집 목록 모달 (shareModal 스타일 재사용) */
.collect-picker-list, .collections-list {
  max-height: 220px;
  overflow-y: auto;
  margin-bottom: 0.8rem;
  text-align: left;
}
.collect-picker-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0.3rem;
  border-bottom: 1px solid #f0eae0;
  font-size: 0.92rem;
  cursor: pointer;
  color: #3b332e;
  font-family: 'Maru Buri', serif;
}
.collect-picker-item input[type="checkbox"] { width: auto; margin: 0; }
.collect-picker-count {
  margin-left: auto;
  font-size: 0.75rem;
  color: #9e9282;
  font-family: 'Noto Sans KR', sans-serif;
}
.collect-picker-empty {
  font-size: 0.88rem;
  color: #8c8275;
  text-align: center;
  line-height: 1.6;
  font-family: 'Maru Buri', serif;
}
.collect-picker-new { display: flex; gap: 0.4rem; margin-bottom: 0.8rem; }
.collect-picker-new input { margin-top: 0; }
.collect-picker-new button {
  width: auto; margin-top: 0; padding: 0.6rem 0.9rem;
  white-space: nowrap; background: #5c4e43; color: #fff;
}
.collections-list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.6rem 0.4rem; border-bottom: 1px solid #f0eae0;
}
.collections-list-name {
  cursor: pointer; color: #3b332e;
  font-family: 'Maru Buri', serif; font-size: 0.95rem;
}
.collections-list-name:hover { color: #8c7355; }
.collections-delete-btn {
  width: auto; margin: 0; padding: 0.2rem 0.5rem;
  background: none; color: #a65b55; border: none; font-size: 0.85rem;
}
.collections-delete-btn:hover { background: #f7e9e8; border-radius: 3px; }

.collections-breadcrumb {
  font-size: 0.82rem;
  color: #8c8275;
  margin-bottom: 0.6rem;
  text-align: left;
  line-height: 1.6;
}
.collections-breadcrumb .crumb {
  cursor: pointer;
  color: #8c7355;
}
.collections-breadcrumb .crumb:hover { text-decoration: underline; }
.collections-breadcrumb .crumb:last-child {
  color: #3b332e;
  font-weight: 600;
  cursor: default;
  text-decoration: none;
}
.viewCurrentBtn {
  width: 100%;
  margin-top: 0;
  margin-bottom: 0.6rem;
  padding: 0.5rem;
  background: #efeae0;
  color: #5c4e43;
  border: 1px solid #dcd4c5;
  font-size: 0.85rem;
}
.collections-view-btn {
  width: auto; margin: 0; padding: 0.2rem 0.4rem;
  background: none; color: #8c7355; border: none; font-size: 0.85rem;
}
.collections-view-btn:hover { background: #f3ecd9; border-radius: 3px; }

.likeParticle {
  position: absolute;
  font-size: 0.85rem;
  pointer-events: none;
  opacity: 0.9;
  animation: heartFly 0.7s ease-out forwards;
}

@keyframes heartFly {
  from { transform: translate(0, 0) scale(0.8); opacity: 1; }
  to { transform: translate(var(--x), var(--y)) scale(1.2); opacity: 0; }
}

/* 형광펜 하이라이트 (북마크/문장 수집용 손글씨 형광펜 느낌) */
.manual-highlight {
  display: inline !important;
  background-color: #d8e3cf !important; /* 옛 올리브색 형광펜 */
  background-image: none !important;
  box-decoration-break: clone !important;
  -webkit-box-decoration-break: clone !important;
  padding: 1px 4px;
  border-radius: 2px;
}

/* 이미지로 저장(html2canvas)할 때만 잠깐 쓰이는 스타일. */
.manual-highlight.capture-hide-bg {
  background-color: transparent !important;
}
.highlight-capture-overlay {
  background-color: #d8e3cf;
  border-radius: 2px;
  z-index: -1;
  pointer-events: none;
}

.relatedBtn {
  background: #efeae0;
  color: #5c4e43;
  border: 1px solid #dcd4c5;
  border-radius: 3px;
  padding: 0.35rem 0.55rem !important;
  font-size: 0.82rem;
  font-family: 'Noto Sans KR', sans-serif;
}
.relatedBtn:hover { background: #e2dacd; }

.related-item {
  background: #fffcf7;
  border-left: 3px solid #8c7355;
  padding: 10px 12px;
  border-radius: 3px;
  margin-bottom: 8px;
  border-top: 1px solid #f0eae0;
  border-right: 1px solid #f0eae0;
  border-bottom: 1px solid #f0eae0;
}
.related-item-text { font-family: 'Nanum Myeongjo', serif; font-size: 13px; color: #2b2623; margin-bottom: 6px; white-space: pre-wrap; line-height: 1.6; }
.related-item-meta { font-size: 11px; color: #9e9282; font-family: 'Noto Sans KR', sans-serif; }

.highlightBtn { background-color: #8c7355; color: #ffffff; }
.highlightBtn:hover { background-color: #6f5a41; }

.search-highlight { background: #f3e1b9; border-radius: 2px; }

/* 커스텀 알림 모달 */
.custom-alert-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(30, 24, 20, 0.4); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; z-index: 10000;
  opacity: 0; transition: opacity 0.25s ease;
}
.custom-alert-overlay.active { opacity: 1; }

.custom-alert-box {
  background: #faf8f3; border-radius: 8px; padding: 24px 28px;
  max-width: 380px; width: 88%; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  border: 1px solid #dcd4c5; transform: translateY(12px) scale(0.95);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); text-align: center;
}

  { label: "명조체 (기본)",  value: "'Nanum Myeongjo', serif" },
  { label: "마루부리",       value: "'Maru Buri', serif" },

  { label: "손글씨(개구)",   value: "'Gaegu', cursive" }

function buildFontOptionsHTML(selectedValue) {
  return FONT_OPTIONS.map(f =>
    `<option value="${f.value}" style="font-family:${f.value};" ${f.value === selectedValue ? "selected" : ""}>${f.label}</option>`

}

let quotes = [];
let likedQuotes = JSON.parse(localStorage.getItem("likedQuotes") || "[]");

let sortAsc = false;
let showingLiked = false; 
let showingHighlight = false; 

function generateQuoteId() {
  return "q_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function ensureQuoteIds(list) {
  list.forEach(q => { if (!q.id) q.id = generateQuoteId(); });
  return list;
}

window.onQuotesUpdated = function (list) {
  quotes = ensureQuoteIds(list || []);
  reRenderCurrentView();
};

function generateCollectionId() {
  return "col_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function normalizeCollections(raw) {
  const values = Object.values(raw);
  const isLegacy = values.length > 0 && Array.isArray(values[0]);
  if (!isLegacy) return raw;

  const migrated = {};
  Object.entries(raw).forEach(([name, indices]) => {
    migrated[generateCollectionId()] = { name, parentId: null, quotes: indices };
  });
  return migrated;
}

let collections = normalizeCollections(JSON.parse(localStorage.getItem("collections") || "{}"));
let showingCollection = null;

const blockedCpRules = [
  { rule:"startsWith", name:"마크" },
  { rule:"startsWith", name:"맠" },
  { rule:"startsWith", name:"민형" },
  { rule:"startsWith", name:"시온" },

  { rule:"endsWith", name:"찬" },

/* ───── 예쁜 커스텀 알림창 (Alert) ───── */
function showAlert(message) {
  const existing = document.querySelector('.custom-alert-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');

/* ───── 예쁜 커스텀 확인창 (Confirm) ───── */
function showConfirm(message, onConfirm) {
  const existing = document.querySelector('.custom-alert-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'custom-alert-overlay';
  
  overlay.innerHTML = `
    <div class="custom-alert-box">
      <div class="custom-alert-message">${message}</div>
      <div class="custom-alert-btns">
        <button class="custom-alert-btn cancel">취소</button>
        <button class="custom-alert-btn confirm">확인</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('active'));

  const closeConfirm = (isApproved) => {
    overlay.classList.remove('active');
    setTimeout(() => {
      overlay.remove();
      if (isApproved && typeof onConfirm === 'function') {
        onConfirm();
      }
    }, 250);
  };

  overlay.querySelector('.confirm').addEventListener('click', () => closeConfirm(true));
  overlay.querySelector('.cancel').addEventListener('click', () => closeConfirm(false));
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeConfirm(false);
  });
}

function highlightText(text, rawKeyword) {
  if (!rawKeyword || !text) return text;

  const keyword = rawKeyword.replace(/\s+/g, "").toLowerCase();
  if (!keyword) return text;

  let result = "";
  let textIndex = 0;

  while (textIndex < text.length) {
    let k = 0;
    let t = textIndex;
    let matchStart = -1;

    while (t < text.length) {
      if (text[t] === " ") { t++; continue; }

      if (text[t].toLowerCase() === keyword[k]) {
        if (k === 0) matchStart = t;
        k++;
        if (k === keyword.length) break;
      } else if (k > 0) {
        k = 0;
        matchStart = -1;
      }
      t++;
    }

    if (k === keyword.length && matchStart !== -1) {
      result += text.slice(0, matchStart) +
                "<mark>" + text.slice(matchStart, t + 1) + "</mark>";
      text = text.slice(t + 1);
      textIndex = 0;
    } else {
      result += text;
      break;
    }
  }

  const words = rawKeyword
    .split(" ")
    .map(w => w.trim())
    .filter(w => w.length > 0);

  words.forEach(word => {
    const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const regex = new RegExp(`(?![^<]*>)(${escaped})`, "gi");
    result = result.replace(regex, "<mark>$1</mark>");
  });

  return result;
}

function updateTotalCount(currentLength = quotes.length) {
  const totalSpan = document.getElementById("totalQuotes");
  if (!totalSpan) return;

  if (showingLiked) {
    totalSpan.textContent = `${currentLength} / ${quotes.length}개`;
  } else {
    totalSpan.textContent = `총 ${quotes.length}개`;
  }
}

function applyMarkdown(text) {
  if (!text) return text;
  text = text.replace(/\*\*\*(.+?)\*\*\*/g, "<b><i>$1</i></b>");
  text = text.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  text = text.replace(/\*(.+?)\*/g, "<i>$1</i>");
  text = text.replace(/~(.+?)~/g, "<s>$1</s>");
  return text;
}

function isBlockedCp(tag) {
  tag = tag.replace(/^#/, "");
  for (let r of blockedCpRules) {
    if (r.rule === "startsWith" && tag.startsWith(r.name)) return true;
    if (r.rule === "endsWith" && tag.endsWith(r.name)) return true;
    if (r.rule === "exact" && tag === r.name) return true;
  }
  return false;
}

function isInAnyCollection(index) {
  const id = quotes[index] && quotes[index].id;
  return Object.values(collections).some(c => c.quotes.includes(id));
}

function updateCollectBtnState(index) {
  const card = document.querySelector(`.quote[data-index='${index}']`);
  if (!card) return;
  const btn = card.querySelector(".collectBtn");
  if (!btn) return;
  btn.classList.toggle("collected", isInAnyCollection(index));
}

function getChildCollections(parentId) {
  return Object.entries(collections)
    .filter(([, c]) => (c.parentId || null) === (parentId || null))
    .map(([id, c]) => ({ id, ...c }))
    .sort((a, b) => a.name.localeCompare(b.name, "ko"));
}

function getCollectionPath(id) {
  const path = [];
  let cur = id;
  while (cur && collections[cur]) {
    path.unshift({ id: cur, name: collections[cur].name });
    cur = collections[cur].parentId;
  }
  return path;
}

function isDescendantOrSelf(id, ancestorId) {
  let cur = id;
  while (cur) {
    if (cur === ancestorId) return true;
    cur = collections[cur] ? collections[cur].parentId : null;
  }
  return false;
}

function deleteCollectionDeep(id) {
  getChildCollections(id).forEach(child => deleteCollectionDeep(child.id));
  delete collections[id];
}

function getAllCollectionsFlat() {
  const result = [];
  function walk(parentId, depth) {
    getChildCollections(parentId).forEach(c => {
      result.push({ ...c, depth });
      walk(c.id, depth + 1);
    });
  }
  walk(null, 0);
  return result;
}

function openCollectPicker(index) {
  const quoteId = quotes[index].id;
  document.querySelectorAll(".collect-picker-overlay, .collections-list-overlay").forEach(el => el.remove());

  const overlay = document.createElement("div");
  overlay.className = "collect-picker-overlay shareOverlay";

  const box = document.createElement("div");
  box.className = "collect-picker-box shareModal";

  function closePicker() { overlay.remove(); box.remove(); }

  function render() {
    const flat = getAllCollectionsFlat();
    box.innerHTML = `
      <h3>📌 모음집에 담기</h3>
      <div class="collect-picker-list">
        ${flat.length === 0
          ? `<p class="collect-picker-empty">아직 만든 모음집이 없어요.<br>아래에서 새로 만들어보세요.</p>`
          : flat.map(c => `
              <label class="collect-picker-item" style="padding-left:${0.3 + c.depth * 1.1}rem;">
                <input type="checkbox" data-id="${c.id}" ${c.quotes.includes(quoteId) ? "checked" : ""}>
                <span>${c.depth > 0 ? "└ " : ""}${c.name}</span>
                <span class="collect-picker-count">${c.quotes.length}개</span>
              </label>
            `).join("")}
      </div>
      <div class="collect-picker-new">
        <input type="text" id="newCollectionName" placeholder="새 모음집 이름 (최상위)">
        <button id="createCollectionBtn">만들기</button>
      </div>
      <button class="closeShareBtn collect-picker-close">닫기</button>
    `;

    box.querySelectorAll(".collect-picker-item input[type='checkbox']").forEach(cb => {
      cb.addEventListener("change", () => {
        const id = cb.dataset.id;
        const c = collections[id];
        if (cb.checked) {
          if (!c.quotes.includes(quoteId)) c.quotes.push(quoteId);
        } else {
          c.quotes = c.quotes.filter(qid => qid !== quoteId);
        }
        saveData();
        updateCollectBtnState(index);
        if (showingCollection === id) reRenderCurrentView();
        render();
      });
    });

    box.querySelector("#createCollectionBtn").onclick = () => {
      const nameInput = box.querySelector("#newCollectionName");
      const name = nameInput.value.trim();
      if (!name) { showAlert("모음집 이름을 입력해주세요."); return; }
      const dup = getChildCollections(null).some(c => c.name === name);
      if (dup) { showAlert("이미 있는 모음집 이름이에요."); return; }
      const id = generateCollectionId();
      collections[id] = { name, parentId: null, quotes: [quoteId] };
      saveData();
      updateCollectBtnState(index);
      render();
    };

    box.querySelector(".collect-picker-close").onclick = closePicker;
  }

  overlay.onclick = closePicker;
  document.body.appendChild(overlay);
  document.body.appendChild(box);
  render();
}

function toggleCollectionView() {
  if (showingCollection) {
    showingCollection = null;
    searchQuotes();
    return;
  }
  openCollectionsListModal();
}

function openCollectionsListModal() {
  document.querySelectorAll(".collect-picker-overlay, .collections-list-overlay").forEach(el => el.remove());

  const overlay = document.createElement("div");
  overlay.className = "collections-list-overlay shareOverlay";

  const box = document.createElement("div");
  box.className = "collections-list-box shareModal";

  let currentParentId = null;

  function closeModal() { overlay.remove(); box.remove(); }

  function render() {
    const path = getCollectionPath(currentParentId);
    const children = getChildCollections(currentParentId);
    const current = currentParentId ? collections[currentParentId] : null;

    const breadcrumbHTML = `
      <div class="collections-breadcrumb">
        <span class="crumb" data-id="">📁 전체</span>
        ${path.map(p => ` › <span class="crumb" data-id="${p.id}">${p.name}</span>`).join("")}
      </div>
    `;

    box.innerHTML = `
      <h3>📁 내 모음집</h3>
      ${breadcrumbHTML}
      ${current ? `<button class="viewCurrentBtn">📖 이 모음집 명대사 보기 (${current.quotes.length}개)</button>` : ""}
      ${children.length === 0
        ? `<p class="collect-picker-empty">${currentParentId ? "아직 하위 모음집이 없어요." : "아직 만든 모음집이 없어요."}<br>아래에서 새로 만들어보세요.</p>`
        : `<div class="collections-list">
            ${children.map(c => `
              <div class="collections-list-item">
                <span class="collections-list-name" data-id="${c.id}">📁 ${c.name}
                  <span class="collect-picker-count">${c.quotes.length}개 · 하위 ${getChildCollections(c.id).length}개</span>
                </span>
                <button class="collections-view-btn" data-id="${c.id}" title="이 모음집 명대사 보기">📖</button>
                <button class="collections-delete-btn" data-id="${c.id}" title="모음집 삭제">✕</button>
              </div>
            `).join("")}
          </div>`
      }
      <div class="collect-picker-new">
        <input type="text" id="newSubCollectionName" placeholder="${currentParentId ? "새 하위 모음집 이름" : "새 모음집 이름"}">
        <button id="createSubCollectionBtn">만들기</button>
      </div>
      <button class="closeShareBtn collections-list-close">닫기</button>
    `;

    box.querySelectorAll(".crumb").forEach(el => {
      el.onclick = () => { currentParentId = el.dataset.id || null; render(); };
    });

    if (current) {
      box.querySelector(".viewCurrentBtn").onclick = () => {
        closeModal();
        viewCollection(currentParentId);
      };
    }

    box.querySelectorAll(".collections-list-name").forEach(el => {
      el.onclick = () => { currentParentId = el.dataset.id; render(); };
    });

    box.querySelectorAll(".collections-view-btn").forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        closeModal();
        viewCollection(id);
      };
    });

    box.querySelectorAll(".collections-delete-btn").forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const name = collections[id].name;
        showConfirm(`'${name}' 모음집을 삭제하시겠습니까?\n(하위 모음집도 함께 삭제되며, 명대사 자체는 삭제되지 않습니다)`, () => {
          if (showingCollection && isDescendantOrSelf(showingCollection, id)) {
            showingCollection = null;
          }
          deleteCollectionDeep(id);
          saveData();
          if (showingCollection === null) searchQuotes();
          render();
        });
      };
    });

    box.querySelector("#createSubCollectionBtn").onclick = () => {
      const input = box.querySelector("#newSubCollectionName");
      const name = input.value.trim();
      if (!name) { showAlert("모음집 이름을 입력해주세요."); return; }
      const dup = getChildCollections(currentParentId).some(c => c.name === name);
      if (dup) { showAlert("같은 위치에 이미 있는 이름이에요."); return; }
      const id = generateCollectionId();
      collections[id] = { name, parentId: currentParentId, quotes: [] };
      saveData();
      render();
    };

    box.querySelector(".collections-list-close").onclick = closeModal;
  }

  overlay.onclick = closeModal;
  document.body.appendChild(overlay);
  document.body.appendChild(box);
  render();
}

function viewCollection(id) {
  const c = collections[id];
  if (!c) return;

  showingLiked = false;
  showingHighlight = false;
  showingCollection = id;

  let filtered = c.quotes.map(qid => {
    const idx = quotes.findIndex(q => q.id === qid);
    if (idx === -1) return null;
    const q = quotes[idx];
    q.__index = idx;
    return q;
  }).filter(Boolean);

  filtered = sortQuoteList(filtered);
  displayFilteredQuotes(filtered);

  const totalSpan = document.getElementById("totalQuotes");
  if (totalSpan) totalSpan.textContent = `📁 ${c.name} · ${filtered.length}개`;
}

function getAllTags() {
  const tagSet = new Set();
  quotes.forEach(q => (q.cpTags || []).forEach(t => tagSet.add(t)));
  return Array.from(tagSet).sort((a, b) => a.localeCompare(b, "ko"));
}

function setupTagAutocomplete(inputEl, boxEl) {
  if (!inputEl || !boxEl) return;

  function currentSegment() {
    const parts = inputEl.value.split(",");
    return parts[parts.length - 1].trim();
  }

  function closeBox() { boxEl.classList.remove("active"); boxEl.innerHTML = ""; }

  function pickTag(tag) {
    const parts = inputEl.value.split(",");
    parts[parts.length - 1] = " " + tag;
    inputEl.value = parts.map(p => p.trim()).filter(Boolean).join(", ") + ", ";
    closeBox();
    inputEl.focus();
  }

  inputEl.addEventListener("input", () => {
    const seg = currentSegment();
    if (!seg) { closeBox(); return; }

    const matches = getAllTags()
      .filter(t => t.toLowerCase().includes(seg.toLowerCase()))
      .slice(0, 8);

    if (matches.length === 0) { closeBox(); return; }

    boxEl.innerHTML = matches
      .map(t => `<div class="tag-suggestion-item">${t}</div>`)
      .join("");
    boxEl.classList.add("active");
  });

  boxEl.addEventListener("mousedown", (e) => {
    const item = e.target.closest(".tag-suggestion-item");
    if (!item) return;
    e.preventDefault();
    pickTag(item.textContent);
  });

  document.addEventListener("click", (e) => {
    if (e.target !== inputEl && !boxEl.contains(e.target)) closeBox();
  });
}

function showRandomQuote() {
  if (quotes.length === 0) return;
  const randomIndex = Math.floor(Math.random() * quotes.length);
  const selectedQuote = quotes[randomIndex];
  selectedQuote.__index = randomIndex;
  displayFilteredQuotes([selectedQuote]);

  const totalSpan = document.getElementById("totalQuotes");
  if (totalSpan) {
    totalSpan.textContent = `1 / ${quotes.length}개`;
  }
}

function autoResize(el) { el.style.height = "auto"; el.style.height = (el.scrollHeight) + "px"; }
function enterSearch(e) { if (e.key === "Enter") { e.preventDefault(); searchQuotes(); } }
function saveData() { 
  localStorage.setItem("likedQuotes", JSON.stringify(likedQuotes)); 
  localStorage.setItem("collections", JSON.stringify(collections));

  if (window.__fb) {
    window.__fb.setDoc(window.__fb.quotesDocRef, { list: quotes }).catch(err => {
      console.error("Firestore 저장 실패:", err);
      showAlert("서버 저장에 실패했어요. 인터넷 연결을 확인해주세요.");
    });
  }
}

function copyQuoteText(text) {
  const tempDiv = document.createElement("div");
  tempDiv.innerHTML = text;
  const cleanText = tempDiv.textContent || tempDiv.innerText || "";

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(cleanText).then(() => {
      showAlert("명대사가 복사되었습니다.");
    }).catch(() => {
      fallbackCopyText(cleanText);
    });
  } else {
    fallbackCopyText(cleanText);
  }
}

function fallbackCopyText(text) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  document.body.appendChild(textArea);
  textArea.select();
  try {
    document.execCommand("copy");
    showAlert("명대사가 복사되었습니다.");
  } catch (err) {
    showAlert("복사에 실패했습니다.");
  }
  document.body.removeChild(textArea);
}

function displayFilteredQuotes(filtered) {
  const listDiv = document.getElementById("quotesList");
  listDiv.innerHTML = "";
  
  filtered.forEach((q) => {
    const index = q.__index !== undefined ? q.__index : quotes.indexOf(q);
    const div = document.createElement("div"); 
    div.className = "quote";
    div.dataset.index = index; 
    const liked = likedQuotes.includes(q.id);
    const userDisplay = q.userId ? `(${q.userId})` : "";

    let titleText = `${q.pota}${userDisplay ? ` ${userDisplay}` : ""}`;
    if (q.comments && q.comments.length > 0) {
      titleText += ` <span class="commentCount">💬 <span class="commentNumber">${q.comments.length}</span></span>`;
    }

    const keyword = window.__highlightKeyword || "";
    const highlightedTitle = highlightText(titleText, keyword);
    const highlightedText  = highlightText(applyMarkdown(q.text), keyword);

    div.innerHTML = `
      <div class="quote-title">${highlightedTitle}</div>
      <div class="quote-text" style="font-family:${q.font || DEFAULT_FONT};">${highlightedText}</div>
    `;

    let metaDiv = null;
    if ((q.cpTags && q.cpTags.length > 0) || q.time) {
      metaDiv = document.createElement("div");
      metaDiv.className = "tags";

      if (q.cpTags && q.cpTags.length > 0) {
        q.cpTags.forEach(tag => {
          const span = document.createElement("span");
          span.className = "tag";
          span.textContent = tag;
          span.onclick = (e) => { e.stopPropagation(); searchByTag(tag); };
          metaDiv.appendChild(span);
        });
      }

      if (q.time) {
        const timeSpan = document.createElement("span");
        timeSpan.style.color = "#888";
        timeSpan.style.fontSize = "0.8rem";
        timeSpan.style.marginLeft = "0.5rem";
        timeSpan.textContent = q.time;
        metaDiv.appendChild(timeSpan);
      }
    }

    if (metaDiv) div.appendChild(metaDiv);

    const actionDiv = document.createElement("div"); 
    actionDiv.className = "actionButtons";

    const likeBtn = document.createElement("button"); 
    likeBtn.className = "likeBtn"; 
    likeBtn.textContent = ` ♥ `;
    if (liked) likeBtn.classList.add("liked");
    likeBtn.onclick = (e) => { e.stopPropagation(); toggleLike(index, likeBtn); };
    actionDiv.appendChild(likeBtn);

    const collectBtn = document.createElement("button");
    collectBtn.className = "collectBtn";
    collectBtn.innerHTML = "📌";
    collectBtn.title = "모음집에 담기";
    if (isInAnyCollection(index)) collectBtn.classList.add("collected");
    collectBtn.onclick = (e) => { e.stopPropagation(); openCollectPicker(index); };
    actionDiv.appendChild(collectBtn);

    const copyBtn = document.createElement("button");
    copyBtn.className = "copyBtn";
    copyBtn.innerHTML = "📋";
    copyBtn.title = "명대사 복사";
    copyBtn.onclick = (e) => {
      e.stopPropagation();
      copyQuoteText(q.text);
    };
    actionDiv.appendChild(copyBtn);

    const editBtn = document.createElement("button"); 
    editBtn.className = "editBtn"; 
    editBtn.textContent = "수정";
    editBtn.onclick = (e) => {
      e.stopPropagation();
      const idx = Number(div.dataset.index);
      editQuote(idx);
    };
    actionDiv.appendChild(editBtn);

    const shareBtn = document.createElement("button");
    shareBtn.className = "shareBtn";
    shareBtn.innerHTML = "📷";
    shareBtn.title = "이미지로 공유";
    shareBtn.onclick = (e) => {
      e.stopPropagation();
      openShareModal(div);
    };
    actionDiv.appendChild(shareBtn);

    /* 관리자 권한을 가진 경우에만 삭제 버튼 생성 */
    if (window.isAdmin) {
      const delBtn = document.createElement("button"); 
      delBtn.className = "deleteBtn"; 
      delBtn.textContent = "삭제";
      delBtn.onclick = (e) => { e.stopPropagation(); deleteQuote(index); };
      actionDiv.appendChild(delBtn);
    }

    div.appendChild(actionDiv);

    const commentSection = document.createElement("div");
    commentSection.className = "commentSection";

    const commentList = document.createElement("div");
    commentSection.appendChild(commentList);

    const commentInput = document.createElement("textarea");
    commentInput.className = "commentInput";
    commentInput.placeholder = "댓글 입력";
    commentInput.spellcheck = false;
    commentSection.appendChild(commentInput);

    const commentBtn = document.createElement("button");
    commentBtn.className = "commentAddBtn";
    commentBtn.textContent = "댓글 추가";
    commentBtn.onclick = (e) => {
      e.stopPropagation(); 
      addComment(index, commentInput.value, commentList); 
      commentInput.value = "";
    };
    commentSection.appendChild(commentBtn);

    div.appendChild(commentSection);

    div.ondblclick = (e) => {
      if (
        e.target.tagName !== "BUTTON" &&
        e.target.className.indexOf("tag") === -1 &&
        !e.target.closest(".commentSection")
      ) {
        const isOpen = commentSection.style.display === "block";
        commentSection.style.display = isOpen ? "none" : "block";
        actionDiv.style.display = isOpen ? "flex" : "none";
      }
    };

    listDiv.appendChild(div);
    if (q.comments) displayComments(q.comments, commentList);
  });
  listDiv.scrollTop = 0;
}

function addComment(index, text, listDiv) {
  text = text.trim();
  if (!text) return;
  const comment = { text, time: new Date().toLocaleString() };
  if (!quotes[index].comments) quotes[index].comments = [];
  quotes[index].comments.push(comment);
  saveData();
  displayComments(quotes[index].comments, listDiv);
  updateQuoteElement(index);
}

function displayComments(comments, listDiv) {
  listDiv.innerHTML = "";
  comments.forEach((c) => {
    const div = document.createElement("div");
    div.className = "comment";
    div.innerHTML = `<span>${c.text}</span><span class="comment-time">${c.time}</span>`;
    listDiv.appendChild(div);
  });
}

function searchByTag(tag) {
  const input = document.getElementById("potaInput");
  input.value = tag;
  searchQuotes();
}

function toggleLike(index, btn) {
  const id = quotes[index].id;
  if (likedQuotes.includes(id)) {
    likedQuotes = likedQuotes.filter(qid => qid !== id);
    btn.classList.remove("liked");
  } else {
    likedQuotes.push(id);
    btn.classList.add("liked");

    for (let i = 0; i < 3; i++) {
      const particle = document.createElement("span");
      particle.className = "likeParticle";
      particle.textContent = "♥";
      particle.style.setProperty("--x", (Math.random() * 40 - 20) + "px");
      particle.style.setProperty("--y", (-Math.random() * 35 - 15) + "px");
      btn.appendChild(particle);
      setTimeout(() => particle.remove(), 700);
    }
  }

  saveData();

  if (showingLiked) {
    let filtered = getLikedFilteredQuotes();
    filtered = sortQuoteList(filtered);
    displayFilteredQuotes(filtered);
  }
}

function showLikedQuotes() {
  if (showingLiked) {
    showingLiked = false;
    searchQuotes();
    return;
  }

  if (likedQuotes.length === 0) {
    showAlert("좋아요한 명대사가 없습니다.");
    return;
  }

  showingLiked = true;
  showingHighlight = false;
  showingCollection = null;

  let filtered = getLikedFilteredQuotes();
  filtered = sortQuoteList(filtered);

  displayFilteredQuotes(filtered);
  updateTotalCount(filtered.length);
}

function addQuote() {
  const userId = document.getElementById("userId").value.trim();
  const pota   = document.getElementById("potaName").value.trim();
  const text   = document.getElementById("quoteText").value.trim();
  const tags   = document.getElementById("tagsInput").value
                   .split(",")
                   .map(t => t.trim())
                   .filter(Boolean);
  const font   = document.getElementById("fontSelect").value || DEFAULT_FONT;

  if (!pota || !text || !userId) {
    showAlert("작품명과 명대사, 작가명을 모두 입력하세요.");
    return;
  }

  for (let t of tags) {
    if (isBlockedCp(t)) {
      showAlert(`차단된 CP 태그: ${t}`);
      return;
    }
  }

  const existingTexts = quotes.map(q => q.text);
  if (isExactDuplicate(text, existingTexts)) {
    showAlert("⚠️ 이미 완전히 동일한 문장이 존재합니다.");
    return;
  }

  const time = new Date().toLocaleString();

  quotes.push({
    id: generateQuoteId(),
    userId,
    pota,
    text,
    cpTags: tags,
    font,
    likes: 0,
    comments: [],
    time,
  });

  saveData();

  document.getElementById("potaName").value = "";
  document.getElementById("quoteText").value = "";
  document.getElementById("tagsInput").value = "";
  document.getElementById("userId").value = "";
  document.getElementById("fontSelect").value = DEFAULT_FONT;

  showAlert("명대사가 추가되었습니다.");

  showingLiked = false;
  showingHighlight = false;
  searchQuotes();

  updateCharCounter();
  draftInputs.forEach(id => localStorage.removeItem("draft_" + id));
}

function extractQuotedText(sentence) {
  if (typeof sentence !== "string") return null;
  const match = sentence.match(/[“"]([^”"]+)[”"]/s);
  return match ? match[1].trim() : null;
}

function normalizePlainSentence(sentence) {
  if (typeof sentence !== "string") return "";
  return sentence.trim().replace(/[.,!?]+$/, "");
}

function isExactDuplicate(newSentence, existingSentences) {
  const newQuoted = extractQuotedText(newSentence);
  const normalizedNewPlain = normalizePlainSentence(newSentence);

  return existingSentences.some(existing => {
    const existingQuoted = extractQuotedText(existing);

    if (newQuoted && existingQuoted) {
      return newQuoted === existingQuoted;
    }

    if (!newQuoted && !existingQuoted) {
      return (
        normalizedNewPlain ===
        normalizePlainSentence(existing)
      );
    }

    return false;
  });
}

function deleteQuote(index) {
  if (!window.isAdmin) {
    showAlert("명대사 삭제는 관리자만 할 수 있습니다.");
    return;
  }
  showConfirm("삭제하시겠습니까?", () => {
    const id = quotes[index].id;
    quotes.splice(index, 1);
    likedQuotes = likedQuotes.filter(qid => qid !== id);

    Object.values(collections).forEach(c => {
      c.quotes = c.quotes.filter(qid => qid !== id);
    });

    saveData();
    reRenderCurrentView();
  });
}

function editQuote(index) {
  const quote = quotes[index];

  const overlay = document.createElement("div");
  Object.assign(overlay.style, {
    position: "fixed",
    inset: "0",
    background: "rgba(0,0,0,0.25)",
    zIndex: "9998"
  });

  const editBox = document.createElement("div");
  Object.assign(editBox.style, {
    position: "fixed",
    top: "50%",
    left: "50%",
    transform: "translate(-50%,-50%)",
    background: "#fff",
    padding: "1rem",
    border: "1px solid #ccc",
    borderRadius: "12px",
    width: "520px",
    maxHeight: "80vh",
    overflowY: "auto",
    zIndex: "9999"
  });

  function closeEditBox() {
    document.removeEventListener("keydown", escHandler);
    overlay.remove();
    editBox.remove();
  }

  const escHandler = (e) => { if (e.key === "Escape") closeEditBox(); };
  document.addEventListener("keydown", escHandler);
  overlay.onclick = closeEditBox;

  const userInput = document.createElement("input");
  userInput.value = quote.userId || "";
  userInput.placeholder = "작가명";
  editBox.appendChild(userInput);

  const potaInput = document.createElement("input");
  potaInput.value = quote.pota || "";
  potaInput.placeholder = "작품명";
  editBox.appendChild(potaInput);

  const textArea = document.createElement("textarea");
  textArea.value = quote.text || "";
  textArea.style.height = "170px";
  editBox.appendChild(textArea);

  const tagWrapper = document.createElement("div");
  tagWrapper.className = "tagInputWrapper";

  const tagInput = document.createElement("input");
  tagInput.value = quote.cpTags ? quote.cpTags.join(", ") : "";

function prepareHighlightsForCapture(cardDiv) {
  const marks = cardDiv.querySelectorAll(".manual-highlight");
  const overlays = [];
  const hadZIndex = cardDiv.style.zIndex;
  if (marks.length === 0) return { overlays, hadZIndex, applied: false };

  cardDiv.style.zIndex = "0";
  const cardRect = cardDiv.getBoundingClientRect();

  marks.forEach(mark => {
    mark.classList.add("capture-hide-bg");
    Array.from(mark.getClientRects()).forEach(rect => {
      const box = document.createElement("div");
      box.className = "highlight-capture-overlay";
      Object.assign(box.style, {
        position: "absolute",
        left: (rect.left - cardRect.left) + "px",
        top: (rect.top - cardRect.top) + "px",
        width: rect.width + "px",
        height: rect.height + "px"
      });
      cardDiv.appendChild(box);
      overlays.push(box);
    });
  });

  return { overlays, hadZIndex, applied: true };
}

function restoreHighlightsForCapture(cardDiv, fix) {
  if (!fix || !fix.applied) return;
  fix.overlays.forEach(el => el.remove());
  cardDiv.querySelectorAll(".manual-highlight.capture-hide-bg")
    .forEach(mark => mark.classList.remove("capture-hide-bg"));
  cardDiv.style.zIndex = fix.hadZIndex || "";
}

function openShareModal(cardDiv) {
  const hideTargets = cardDiv.querySelectorAll(".editBtn, .deleteBtn, .shareBtn, .copyBtn");
  hideTargets.forEach(el => el.style.display = "none");

  const overlay = document.createElement("div");
  overlay.className = "shareOverlay";

  const modal = document.createElement("div");
  modal.className = "shareModal";
  modal.innerHTML = `
    <h3>명대사 공유</h3>
    <div class="sharePreview">이미지 생성 중...</div>
    <div class="shareActions">
      <button class="saveImgBtn">이미지 저장</button>
      <button class="closeShareBtn">닫기</button>
    </div>
  `;

  document.body.appendChild(overlay);
  document.body.appendChild(modal);

  function restoreButtons() {
    hideTargets.forEach(el => el.style.display = "");
  }

  function closeModal() {
    restoreButtons();
    overlay.remove();
    modal.remove();
  }

  overlay.onclick = closeModal;
  modal.querySelector(".closeShareBtn").onclick = closeModal;

  const highlightFix = prepareHighlightsForCapture(cardDiv);

  html2canvas(cardDiv, {
    backgroundColor: "#ffffff",
    scale: 2
  }).then(canvas => {
    restoreHighlightsForCapture(cardDiv, highlightFix);
    const imgUrl = canvas.toDataURL("image/png");
    modal.querySelector(".sharePreview").innerHTML = `<img src="${imgUrl}">`;

    modal.querySelector(".saveImgBtn").onclick = () => {
      const a = document.createElement("a");
      a.href = imgUrl;
      a.download = "quote_card.png";
      a.click();
    };

    restoreButtons();
  }).catch(() => {
    restoreHighlightsForCapture(cardDiv, highlightFix);
    restoreButtons();
    modal.querySelector(".sharePreview").textContent = "이미지 생성에 실패했습니다.";
  });
}

function searchQuotes() {
  const raw = document.getElementById("potaInput").value.toLowerCase().trim();

  const history = JSON.parse(localStorage.getItem("searchHistory") || "[]");
  if (raw) {
    history.push(raw.replace(/\s+/g, ""));
    localStorage.setItem("searchHistory", JSON.stringify(history));
  }

  let mappedQuotes = quotes.map((q, idx) => ({ ...q, __index: idx }));

  if (!raw) {
    let all = mappedQuotes.slice();
    all = sortQuoteList(all);
    displayFilteredQuotes(all);
    updateTotalCount();
    return;
  }

  const minusParts = raw.split("-").map(v => v.trim()).filter(Boolean);
  const base = minusParts[0] || "";
  const excludes = minusParts.slice(1).map(v => v.replace(/\s+/g, ""));

  window.__highlightKeyword = base;

  const orParts = base.split("|").map(v => v.trim()).filter(Boolean);
  const andParts = orParts.map(p =>
    p.split(/\s+/).map(v => v.trim()).filter(Boolean)
  );

  let filtered = mappedQuotes.filter(q => {
    const pota = (q.pota || "").toLowerCase();
    const text = (q.text || "").toLowerCase();
    const tags = (q.cpTags || []).join(" ").toLowerCase();
    const user = (q.userId || "").toLowerCase();

    const allText = (pota + text + tags + user).replace(/\s+/g, "");

    for (let ex of excludes) {
      if (allText.includes(ex)) return false;
    }

    return andParts.some(group =>
      group.every(word => allText.includes(word.replace(/\s+/g, "")))
    );
  });

  filtered = sortQuoteList(filtered);

  displayFilteredQuotes(filtered);

  const totalSpan = document.getElementById("totalQuotes");
  if (totalSpan) {
    totalSpan.textContent = `${filtered.length} / ${quotes.length}개`;
  }
}

function handleHighlightButton() {
  const selection = window.getSelection();

  if (selection && selection.rangeCount > 0 && !selection.isCollapsed) {
    const range = selection.getRangeAt(0);
    const container = range.commonAncestorContainer;
    const quoteEl = container.nodeType === 3
      ? container.parentElement.closest(".quote")
      : container.closest?.(".quote");

    if (!quoteEl) {
      showAlert("명대사 카드 안에서만 하이라이트할 수 있습니다.");
      selection.removeAllRanges();
      return;
    }

    const index = Number(quoteEl.dataset.index);
    const textEl = quoteEl.querySelector(".quote-text");

    if (!textEl.contains(range.commonAncestorContainer)) {
      selection.removeAllRanges();
      return;
    }

    let startContainer = range.startContainer;
    let parentMark = startContainer.nodeType === 3
      ? startContainer.parentElement.closest("mark.manual-highlight")
      : startContainer.closest?.("mark.manual-highlight");

    if (parentMark) {
      const parent = parentMark.parentNode;
      while (parentMark.firstChild) parent.insertBefore(parentMark.firstChild, parentMark);
      parent.removeChild(parentMark);
    } else {
      const mark = document.createElement("mark");
      mark.className = "manual-highlight";
      mark.appendChild(range.extractContents());
      range.insertNode(mark);

      requestAnimationFrame(() => {
        mark.classList.add("animate");
        setTimeout(() => mark.classList.remove("animate"), 400);
      });
    }

    selection.removeAllRanges();
    quotes[index].text = textEl.innerHTML;
    saveData();
    showingHighlight = false;
  } else {
    if (showingHighlight) {
      showingHighlight = false;
      searchQuotes();
      return;
    }

    let highlightedQuotes = quotes.map((q, idx) => ({ ...q, __index: idx }))
                                  .filter(q => q.text.includes("manual-highlight"));

    if (highlightedQuotes.length === 0) {
      showAlert("하이라이트한 명대사가 없습니다.");
      return;
    }

    showingHighlight = true;
    showingLiked = false;
    showingCollection = null;
    highlightedQuotes = sortQuoteList(highlightedQuotes);
    displayFilteredQuotes(highlightedQuotes);

    const totalSpan = document.getElementById("totalQuotes");
    if (totalSpan) {
      totalSpan.textContent = `${highlightedQuotes.length} / ${quotes.length}개`;
    }
  }
}

function updateQuoteElement(index) {
  const listDiv = document.getElementById("quotesList");
  const div = listDiv.querySelector(`.quote[data-index='${index}']`);
  if (!div) return;

  const quote = quotes[index];
  const userDisplay = quote.userId ? `(${quote.userId})` : "";

  let titleText = `${quote.pota}${userDisplay ? ` ${userDisplay}` : ""}`;
  if (quote.comments && quote.comments.length > 0) {
    titleText += ` <span class="commentCount">💬 <span class="commentNumber">${quote.comments.length}</span></span>`;
  }
  div.querySelector(".quote-title").innerHTML = titleText;

  const processedText = applyMarkdown(quote.text);
  const textEl = div.querySelector(".quote-text");
  textEl.innerHTML = processedText;
  textEl.style.fontFamily = quote.font || DEFAULT_FONT;

  const oldTags = div.querySelector(".tags");
  if (oldTags) oldTags.remove();

  if (quote.cpTags && quote.cpTags.length > 0) {
    const tagsDiv = document.createElement("div");
    tagsDiv.className = "tags";

    quote.cpTags.forEach(tag => {
      const span = document.createElement("span");
      span.className = "tag";
      span.textContent = tag;
      span.onclick = (e) => {
        e.stopPropagation();
        searchByTag(tag);
      };
      tagsDiv.appendChild(span);
    });

    div.appendChild(tagsDiv);
  }

  const commentSection = div.querySelector(".commentSection");
  if (commentSection) {
    const commentList = commentSection.querySelector("div");
    displayComments(quote.comments || [], commentList);
  }

  const likeBtn = div.querySelector(".likeBtn");
  if (likeBtn) {
    if (likedQuotes.includes(quote.id)) {
      likeBtn.classList.add("liked");
    } else {
      likeBtn.classList.remove("liked");
    }
  }
}

  }
