<html lang="ko">
<head>

<title>명대사 공유</title>

<style>
/* ───── 전체 화면 기본 ───── */
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  font-family: 'Nanum Myeongjo', 'Maru Buri', serif;
  background-color: #f6f3eb;
  background-image: 
    radial-gradient(#e2dad0 0.75px, transparent 0.75px),
    radial-gradient(#e2dad0 0.75px, #f6f3eb 0.75px);
  background-size: 30px 30px;
  background-position: 0 0, 15px 15px;
  color: #2b2623;
  display: flex;
  flex-direction: column;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #efeae1; }
::-webkit-scrollbar-thumb { background: #c5b8a5; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #a3937d; }

.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.leftPanel {
  flex: 1.5;
  padding: 1.8rem 2rem;
  overflow-y: auto;
  background: transparent;
  display: flex;
  flex-direction: column;
}

.rightPanel {
  flex: 1; 
  padding: 1.8rem 2rem;
  background: #faf8f3;
  overflow: auto; 
  border-left: 2px solid #e0d8cb;
  box-shadow: inset 10px 0 15px -8px rgba(67, 54, 43, 0.06);
  display: flex;
  flex-direction: column;
}

h2 { 
  color: #1c1816; 
  font-family: 'Nanum Myeongjo', serif; 
  font-weight: 700; 
  margin-bottom: 0.8rem; 
  letter-spacing: -0.5px;
}

input, textarea, button { 
  width: 100%; 
  padding: 0.7rem 0.9rem; 
  margin-top: 0.5rem; 
  border-radius: 4px;
  border: 1px solid #dcd4c5; 
  background-color: #fffcf7;
  color: #2b2623;
  box-sizing: border-box; 
  font-size: 0.95rem; 
  font-family: 'Maru Buri', serif; 
  transform: none;
  transition: all 0.2s ease;
}

input:focus, textarea:focus {
  outline: none;
  border-color: #8c7355;
  background-color: #ffffff;
  box-shadow: 0 0 0 3px rgba(140, 115, 85, 0.1);
}

#quoteText, .commentInput { 
  overflow: auto; 
  font-family: 'Nanum Myeongjo', serif;
  font-weight: 400; 
  font-size: 1.02rem; 
  line-height: 1.75; 
  resize: none; 
}
#quoteText { flex: 1; min-height: 0; }

button { 
  background: #5c4e43;
  color: #f7f4ef; 
  border: none; 
  cursor: pointer; 
  transition: 0.2s; 
  font-weight: 500; 
  font-family: 'Noto Sans KR', sans-serif;
  margin-top: 0.8rem; 
  border-radius: 4px; 
  letter-spacing: 0.5px;
}
button:hover { background: #3e332a; }

#refreshBtn { 
  background: #eae2d5; 
  color: #5c4e43; 
  font-size: 0.85rem; 
  margin-top: 0.3rem; 
}
#refreshBtn:hover { background: #dbcfbc; }

.quote {
  border-radius: 4px;
  padding: 1.2rem 1.4rem;
  margin-top: 0.8rem;
  background: #fffcf7;
  border: 1px solid #e8e1d3;
  border-left: 4px solid #a38f78;
  box-shadow: 0 4px 12px rgba(67, 54, 43, 0.04);
  position: relative;
  font-weight: 400;
  font-size: 1rem;
  line-height: 1.8;
  white-space: pre-line;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.quote:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(67, 54, 43, 0.08);
  background: #ffffff;
}

.quote-title { 
  font-family: 'Nanum Myeongjo', serif; 
  font-weight: 700; 
  margin-bottom: 0.5rem; 
  color: #1c1816; 
  white-space: normal; 
  font-size: 1.08rem; 
  letter-spacing: -0.3px;
}

.quote-text { 
  font-family: 'Nanum Myeongjo', serif; 
  font-weight: 400; 
  margin: 0; 
  white-space: pre-wrap; 
  padding: 0 0.2rem; 
  color: #3b332e; 
  letter-spacing: -0.2px;
}

.actionButtons { position: absolute; bottom: 10px; right: 10px; display: flex; gap: 5px; font-size: 0.85rem; }

.actionButtons button {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.78rem;
  padding: 0.3rem 0.6rem;
  border-radius: 3px;
  font-weight: 500;
  width: auto !important;
  height: auto;
  line-height: 1;
  margin: 0;
  flex: none;
  white-space: nowrap;
}

.likeBtn {
  background: #fff;
  border: 1px solid #dcd4c5;
  color: #8c8275;
  position: relative;
}
.likeBtn.liked {
  color: #c04e46;
  border-color: #e5b3af;
  background: #fdf5f4;
}

.copyBtn {
  background: #fff;
  border: 1px solid #dcd4c5;
  color: #5c4e43;
}
.copyBtn:hover { background: #efeae1; }

.editBtn {
  background: #8c7355;
  color: white;
}

.deleteBtn {
  background: #a65b55;
  color: white;
}

.shareBtn {
  background: #5c4e43;
  color: white;
  font-size: 0.8rem;
}

.tags { margin-top: 0.8rem; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
.tag { 
  display: inline-block; 
  background: #efeae0; 
  color: #5c4e43; 
  padding: 0.2rem 0.6rem; 
  border-radius: 2px; 
  border: 1px solid #e0d7c6;
  cursor: pointer; 
  font-size: 0.78rem; 
  font-family: 'Maru Buri', serif;
}
.tag:hover { background: #e2dacd; color: #1c1816; }

.tagInputWrapper { position: relative; }

.tag-suggestions {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  margin-top: 2px;
  background: #fffcf7;
  border: 1px solid #dcd4c5;
  border-radius: 4px;
  max-height: 170px;
  overflow-y: auto;
  z-index: 60;
  box-shadow: 0 6px 16px rgba(67, 54, 43, 0.1);
}
.tag-suggestions.active { display: block; }
.tag-suggestion-item {
  padding: 0.45rem 0.8rem;
  cursor: pointer;
  font-size: 0.85rem;
  color: #5c4e43;
  font-family: 'Maru Buri', serif;
}
.tag-suggestion-item:hover,
.tag-suggestion-item.active-hover {
  background: #efeae0;
  color: #1c1816;
}

#quotesList { 
  flex: 1; 
  overflow-y: auto; 
  margin-top: 0.5rem; 
  padding: 0.5rem; 
  border-radius: 4px; 
  background: rgba(234, 226, 213, 0.3); 
}

.commentSection { 
  margin-top: 0.8rem; 
  padding: 0.8rem; 
  background: #f7f3eb; 
  border-radius: 4px; 
  border: 1px dashed #d6cbba; 
  display: none; 
}

.comment { 
  background: #ffffff; 
  padding: 0.6rem 0.8rem; 
  border-radius: 3px; 
  margin-bottom: 0.4rem; 
  font-size: 0.88rem; 
  line-height: 1.5; 
  border: 1px solid #eae2d5; 
  font-family: 'Maru Buri', serif;
}
.comment-user { font-weight: 700; margin-right: 0.3rem; color: #43362d; }
.comment-time { font-size: 0.72rem; color: #9e9282; margin-left: 0.3rem; font-family: 'Noto Sans KR', sans-serif; }

.commentInput { 
  margin-top: 0.4rem; 
  border: 1px solid #dcd4c5; 
  border-radius: 3px; 
  padding: 0.5rem; 
  min-height: 50px; 
}

.commentNameInput {
  margin-top: 0.4rem;
  border: 1px solid #dcd4c5;
  border-radius: 3px;
  padding: 0.4rem 0.5rem;
  width: 100%;
  box-sizing: border-box;
  font-size: 0.82rem;
  font-family: 'Noto Sans KR', sans-serif;
}

.commentAddBtn { 
  background: #5c4e43; 
  color: white; 
  border: none; 
  border-radius: 3px; 
  padding: 0.4rem; 
  margin-top: 0.3rem; 
  cursor: pointer; 
  font-weight: 500; 
}
.commentAddBtn:hover { background: #3e332a; }

#alertBox {
  position: fixed;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  background: #3e332a;
  color: #f7f4ef;
  padding: 0.65rem 1.4rem;
  border-radius: 4px;
  display: none;
  z-index: 9999;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  font-family: 'Maru Buri', serif;
}

#alertBox button {
  background: #faf8f3;
  color: #2b2623;
  border: 1px solid #dcd4c5;
  width: auto;
  padding: 0.3rem 0.8rem;
  margin-top: 0;
  display: inline-block;
  transform: translateY(-1px);
}

#alertBox button:hover { background: #efeae1; }
#alertBox span { display: inline-block; }

.smallBtn {
  background: #a65b55;
  color: white;
  font-size: 0.8rem;
  padding: 0.35rem 0.65rem;
  border-radius: 3px;
  font-weight: 500;
  cursor: pointer;
  width: fit-content;
  margin-top: 0;
  font-family: 'Noto Sans KR', sans-serif;
}
.smallBtn:hover { background: #8e4a45; }

.headerWithButton { display: flex; flex-direction: column; gap: 10px; margin-bottom: 0.8rem; }
.headerTop { display: flex; align-items: center; justify-content: space-between; }
.headerTop h2 { margin: 0; font-size: 1.35rem; }

.headerBtns { display: flex; gap: 6px; align-items: center; width: 100%; }
.headerBtns .smallBtn { margin-top: 0; white-space: nowrap; font-size: 0.8rem; padding: 0.45rem 0.65rem; }
.headerBtns .highlightBtn, .headerBtns .likeBtn { flex: 1; text-align: center; }

.iconOnlyBtn {
  padding: 0.45rem 0.6rem !important;
  background-color: #fffcf7 !important;
  color: #5c4e43 !important;
  border: 1px solid #dcd4c5 !important;
  flex: none;
  flex-shrink: 0;
}
.iconOnlyBtn:hover { background-color: #efeae1 !important; }

.commentCount { color: #9e9282; margin-left: 0.2rem; white-space: nowrap; }
.commentNumber { font-size: 0.75rem; font-weight: normal; }

.commentEditTextarea {
  width: 100%;
  min-height: 50px;
  max-height: 80px;
  resize: none;
  overflow-y: auto;
  box-sizing: border-box;
  padding: 0.5rem;
  font-size: 0.92rem;
  line-height: 1.5;
  border-radius: 3px;
  border: 1px solid #dcd4c5;
  font-family: 'Maru Buri', serif;
}

.totalCount { font-weight: normal; font-size: 0.85rem; color: #8c8275; margin-left: 0.3rem; font-family: 'Noto Sans KR', sans-serif; }
.listHeader { display: flex; align-items: center; gap: 0.25rem; }

.sortIcon {
  background: none;
  border: none;
  padding: 4px 6px;
  width: auto;
  height: auto;
  font-size: 1rem;
  cursor: pointer;
  opacity: 0.7;
  margin-top: 0;
}
.sortIcon:hover { opacity: 1; transform: scale(1.15); }
.sort-new, .sort-old, .sort-popular { color: #8c7355; font-weight: 600; }
#reportsAdminBtn { position: relative; }
.reportsBadge {
  position: absolute;
  top: -2px;
  right: -4px;
  background: #c0392b;
  color: #fff;
  border-radius: 999px;
  font-size: 0.65rem;
  line-height: 1;
  padding: 2px 5px;
  font-weight: 700;
}

mark { background: #f3e1b9; border-radius: 2px; }

.shareOverlay {
  position: fixed;
  inset: 0;
  background: rgba(30, 24, 20, 0.5);
  backdrop-filter: blur(3px);
  z-index: 9998;
}

.shareModal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #faf8f3;
  border-radius: 8px;
  padding: 1.4rem;
  width: 360px;
  max-width: 90%;
  z-index: 9999;
  border: 1px solid #dcd4c5;
  box-shadow: 0 16px 35px rgba(0,0,0,0.2);
}

.shareModal h3 {
  margin: 0 0 0.8rem;
  text-align: center;
  font-family: 'Nanum Myeongjo', serif;
  color: #1c1816;
}

.sharePreview img {
  width: 100%;
  border-radius: 4px;
  margin-bottom: 0.8rem;
  border: 1px solid #e0d7c6;
}

.shareActions { display: flex; gap: 0.5rem; }
.shareActions button { flex: 1; padding: 0.6rem; border-radius: 4px; border: none; cursor: pointer; margin-top: 0; }
.saveImgBtn { background: #5c4e43; color: white; }
.closeShareBtn { background: #eae2d5; color: #5c4e43; }

.likeParticle {
  position: absolute;
  font-size: 0.85rem;
  pointer-events: none;
  opacity: 0.9;
  animation: heartFly 0.7s ease-out forwards;
}

@keyframes heartFly {
  from { transform: translate(0, 0) scale(0.8); opacity: 1; }
  to { transform: translate(var(--x), var(--y)) scale(1.2); opacity: 0; }
}

.manual-highlight {
  display: inline !important;
  background-color: #d8e3cf !important;
  background-image: none !important;
  box-decoration-break: clone !important;
  -webkit-box-decoration-break: clone !important;
  padding: 1px 4px;
  border-radius: 2px;
}

.manual-highlight.capture-hide-bg {
  background-color: transparent !important;
}
.highlight-capture-overlay {
  background-color: #d8e3cf;
  border-radius: 2px;
  z-index: -1;
  pointer-events: none;
}

.relatedBtn {
  background: #efeae0;
  color: #5c4e43;
  border: 1px solid #dcd4c5;
  border-radius: 3px;
  padding: 0.35rem 0.55rem !important;
  font-size: 0.82rem;
  font-family: 'Noto Sans KR', sans-serif;
}
.relatedBtn:hover { background: #e2dacd; }

.related-item {
  background: #fffcf7;
  border-left: 3px solid #8c7355;
  padding: 10px 12px;
  border-radius: 3px;
  margin-bottom: 8px;
  border-top: 1px solid #f0eae0;
  border-right: 1px solid #f0eae0;
  border-bottom: 1px solid #f0eae0;
}
.related-item-text { font-family: 'Nanum Myeongjo', serif; font-size: 13px; color: #2b2623; margin-bottom: 6px; white-space: pre-wrap; line-height: 1.6; }
.related-item-meta { font-size: 11px; color: #9e9282; font-family: 'Noto Sans KR', sans-serif; }

.highlightBtn { background-color: #8c7355; color: #ffffff; }
.highlightBtn:hover { background-color: #6f5a41; }

.search-highlight { background: #f3e1b9; border-radius: 2px; }

.custom-alert-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(30, 24, 20, 0.4); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; z-index: 10000;
  opacity: 0; transition: opacity 0.25s ease;
}
.custom-alert-overlay.active { opacity: 1; }

.custom-alert-box {
  background: #faf8f3; border-radius: 8px; padding: 24px 28px;
  max-width: 380px; width: 88%; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  border: 1px solid #dcd4c5; transform: translateY(12px) scale(0.95);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); text-align: center;
}
.custom-alert-overlay.active .custom-alert-box { transform: translateY(0) scale(1); }

.custom-alert-message {
  font-size: 15px; color: #2b2623; line-height: 1.6;
  margin-bottom: 20px; white-space: pre-line; word-break: keep-all;
  font-family: 'Maru Buri', serif;
}

.custom-alert-btns { display: flex; gap: 8px; justify-content: center; }
.custom-alert-btn {
  flex: 1; padding: 9px 16px; border-radius: 4px; font-size: 14px;
  font-weight: 500; border: none; cursor: pointer; transition: all 0.2s ease;
  font-family: 'Noto Sans KR', sans-serif;
}
.custom-alert-btn.confirm { background: #5c4e43; color: #ffffff; }
.custom-alert-btn.confirm:hover { background: #3e332a; }
.custom-alert-btn.cancel { background: #eae2d5; color: #5c4e43; }
.custom-alert-btn.cancel:hover { background: #dbcfbc; }

.guide-modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(30, 24, 20, 0.4); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; z-index: 10000;
  opacity: 0; transition: opacity 0.3s ease;
}
.guide-modal-overlay.active { opacity: 1; }

.guide-modal-card {
  background: #faf8f3; border-radius: 8px; width: 90%; max-width: 500px;
  max-height: 85vh; display: flex; flex-direction: column;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15); border: 1px solid #dcd4c5;
  transform: translateY(20px) scale(0.95); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow: hidden;
}
.guide-modal-overlay.active .guide-modal-card { transform: translateY(0) scale(1); }

.guide-header {
  padding: 20px 24px 16px; border-bottom: 1px solid #e8e1d3;
  display: flex; align-items: center; justify-content: space-between;
}
.guide-header h3 { margin: 0; font-size: 18px; color: #1c1816; font-family: 'Nanum Myeongjo', serif; font-weight: 700; }

.guide-body { padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.guide-item { display: flex; gap: 14px; align-items: flex-start; }
.guide-icon {
  font-size: 20px; background: #efeae0; width: 42px; height: 42px;
  border-radius: 4px; border: 1px solid #e0d7c6; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0; color: #5c4e43;
}
.guide-text h4 { margin: 0 0 4px 0; font-size: 14px; color: #1c1816; font-family: 'Maru Buri', serif; }
.guide-text p { margin: 0; font-size: 13px; color: #706456; line-height: 1.5; font-family: 'Noto Sans KR', sans-serif; }

.guide-footer {
  padding: 16px 24px; border-top: 1px solid #e8e1d3;
  display: flex; align-items: center; justify-content: space-between; background: #f6f3eb;
}
.guide-footer label { font-size: 13px; color: #706456; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: 'Noto Sans KR', sans-serif; }

.guide-close-btn {
  background: #5c4e43; color: white; border: none; padding: 8px 18px;
  border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s;
  font-family: 'Noto Sans KR', sans-serif;
}
.guide-close-btn:hover { background: #3e332a; }

@keyframes highlightFill {
  from { background-size: 0% 100%; }
  to { background-size: 100% 100%; }
}

.mobileTabBar { display: none; }
.floatHighlightBtn { display: none; }

@keyframes floatHlPop {
  from { transform: scale(0.6); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}

@media (max-width: 768px) {
  body { height: 100vh; height: 100dvh; }

  .layout {
    flex-direction: column;
    overflow-y: auto;
  }

  .leftPanel, .rightPanel {
    flex: none;
    width: 100%;
    padding: 1.2rem 1rem;
    box-sizing: border-box;
  }

  .rightPanel {
    border-left: none;
    border-top: 2px solid var(--c-panel-border, #e0d8cb);
    box-shadow: inset 0 10px 15px -8px rgba(67, 54, 43, 0.06);
  }

  .quote {
    padding: 1rem 1.1rem 3.2rem 1.1rem;
  }

  .actionButtons {
    position: absolute;
    bottom: 8px;
    right: 8px;
    left: 8px;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 4px;
  }

  .actionButtons button {
    font-size: 0.72rem;
    padding: 0.25rem 0.5rem;
  }

  .shareModal {
    width: 90%;
    max-width: 340px;
    padding: 1.1rem;
  }

  .mobileTabBar {
    display: flex;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    background: #faf8f3;
    border-top: 1px solid #e0d8cb;
    box-shadow: 0 -4px 14px rgba(67, 54, 43, 0.06);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .mobileTabBar button {
    flex: 1;
    width: auto;
    margin: 0;
    padding: 0.5rem 0 0.45rem;
    border: none;
    border-top: 3px solid transparent;
    border-radius: 0;
    background: transparent;
    color: #9e9282;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.74rem;
    font-weight: 500;
    letter-spacing: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .mobileTabBar button:hover { background: transparent; }
  .mobileTabBar .tabIcon { font-size: 1.15rem; line-height: 1; }
  .mobileTabBar button.active {
    color: #5c4e43;
    border-top-color: #8c7355;

  async function migrateOldDataIfNeeded() {
    try {
      if (localStorage.getItem(MIGRATION_FLAG) === "1") return;
    } catch (e) {}

    try {
      const oldSnap = await getDoc(doc(db, "shared", "quotes"));
      if (!oldSnap.exists()) { markMigrationChecked(); return; }
      const oldList = oldSnap.data().list || [];
      if (oldList.length === 0) { markMigrationChecked(); return; }

      const existing = await getDocs(quotesCol);
      if (!existing.empty) { markMigrationChecked(); return; }

      for (const q of oldList) {
        const { id, ...rest } = q;

    const admin = computeIsAdmin();
    if (admin && !reportsUnsub) {
      reportsUnsub = onSnapshot(reportsCol, (snap) => {
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      window.onAuthChanged({
        uid: user ? user.uid : null,

      });

    syncReportsSubscription();
    if (user && !migrated) {
      migrated = true;
      await migrateOldDataIfNeeded();

    likeQuote: (id) => updateDoc(doc(db, "quotes", id), { likes: increment(1) }),
    unlikeQuote: (id) => runTransaction(db, async (tx) => {
      const ref = doc(db, "quotes", id);
      const snap = await tx.get(ref);
      const current = snap.exists() ? (snap.data().likes || 0) : 0;
      tx.update(ref, { likes: Math.max(0, current - 1) });
    }),
    reportQuote: (quoteId, reason) => addDoc(reportsCol, {
      quoteId,
      reason: reason || "",
      time: new Date().toLocaleString(),
      reporterId: currentUser ? currentUser.uid : null
    }),
    deleteReport: (id) => deleteDoc(doc(db, "reports", id)),
    getUid: () => (currentUser ? currentUser.uid : null),
    isAdmin: computeIsAdmin,
    loginAdmin: (email, password) => signInWithEmailAndPassword(auth, email, password),
    logoutAdmin: async () => {
      await signOut(auth);
      return signInAnonymously(auth);
    }
  };

<script>
const DEFAULT_FONT = "'Maru Buri', serif";

let quotes = [];
let quoteIndexById = new Map();
let tagCache = null;
let renderQueued = false;
let renderDeferred = false;
let floatHlVisible = false;
let likedQuotes = JSON.parse(localStorage.getItem("likedQuotes") || "[]");

let sortMode = "newest";

function generateQuoteId() {
  return "q_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function ensureQuoteIds(list) {
  list.forEach(q => { if (!q.id) q.id = generateQuoteId(); });
  return list;
}

window.onQuotesUpdated = function (list) {
  quotes = ensureQuoteIds(list || []);

  quoteIndexById = new Map();
  quotes.forEach((q, i) => {
    quoteIndexById.set(q.id, i);
    Object.defineProperty(q, "__index", { value: i, writable: true, configurable: true, enumerable: false });
  });
  tagCache = null;

  scheduleRender();
  backfillMissingTimestamps();
};

function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    if (floatHlVisible) { renderDeferred = true; return; }
    reRenderCurrentView();
  });
}

let currentReports = [];

window.onAuthChanged = function (status) {

const blockedCpRules = [
  { rule:"startsWith", name:"마크" },
  { rule:"startsWith", name:"맠" },

  { rule:"startsWith", name:"시온" },

  { rule:"endsWith", name:"동" },
  { rule:"endsWith", name:"동혁" },
  { rule:"endsWith", name:"해찬" },
  { rule:"endsWith", name:"찬" },
  { rule:"endsWith", name:"쿨" },
  { rule:"endsWith", name:"윳" },
  { rule:"endsWith", name:"댕" }
];

document.getElementById("statsBtn").onclick = openStatsModal;
document.getElementById("randomQuoteBtn").onclick = showRandomQuote;
setupTagAutocomplete(document.getElementById("tagsInput"), document.getElementById("tagSuggestions"));

const sortBtn = document.getElementById("sortToggleBtn");

function getQuoteTimestamp(q) {
  if (typeof q.createdAt === "number") return q.createdAt;

  const raw = q.time || "";

  const koMatch = raw.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\.\s*(오전|오후)?\s*(\d{1,2}):(\d{1,2}):(\d{1,2})/);
  if (koMatch) {
    let [, y, mo, d, ampm, h, mi, s] = koMatch;
    h = Number(h);
    if (ampm === "오후" && h < 12) h += 12;
    if (ampm === "오전" && h === 12) h = 0;
    const dt = new Date(Number(y), Number(mo) - 1, Number(d), h, Number(mi), Number(s));
    if (!isNaN(dt.getTime())) return dt.getTime();
  }

  const parsed = Date.parse(raw);
  return isNaN(parsed) ? 0 : parsed;
}

const backfilledQuoteIds = new Set();
function backfillMissingTimestamps() {
  if (!window.__fb || !window.__fb.isAdmin()) return;
  quotes.forEach((q, i) => {
    if (typeof q.createdAt === "number") return;
    if (backfilledQuoteIds.has(q.id)) return;
    backfilledQuoteIds.add(q.id);
    const fallback = getQuoteTimestamp(q) || (Date.now() - (quotes.length - i) * 1000);
    window.__fb.updateQuote(q.id, { createdAt: fallback }).catch(err => console.error(err));
  });
}

function sortQuoteList(list) {
  if (sortMode === "popular") {
    return list.slice().sort((a, b) => (b.likes || 0) - (a.likes || 0));
  }
  const keyed = list.map(q => ({ q, t: getQuoteTimestamp(q) }));
  if (sortMode === "oldest") keyed.sort((a, b) => a.t - b.t);
  else keyed.sort((a, b) => b.t - a.t);
  return keyed.map(k => k.q);
}

function updateSortIcon() {
  if (sortMode === "oldest") {
    sortBtn.innerHTML = `<span class="sort-old">🕰 오래된</span>`;
  } else if (sortMode === "popular") {
    sortBtn.innerHTML = `<span class="sort-popular">🔥 인기순</span>`;
  } else {
    sortBtn.innerHTML = `<span class="sort-new">✨ 최신</span>`;
  }
}

function getLikedFilteredQuotes() {
  return likedQuotes.map(id => {
    const idx = quoteIndexById.get(id);
    if (idx === undefined) return null;
    return quotes[idx];
  }).filter(Boolean);
}

function reRenderCurrentView() {
  if (showingLiked) {
    let filtered = getLikedFilteredQuotes();
    filtered = sortQuoteList(filtered);
    displayFilteredQuotes(filtered);
    updateTotalCount(filtered.length);
  } else if (showingHighlight) {
    let highlightedQuotes = quotes.filter(q => q.text.includes("manual-highlight"));
    highlightedQuotes = sortQuoteList(highlightedQuotes);
    displayFilteredQuotes(highlightedQuotes);
    const totalSpan = document.getElementById("totalQuotes");
    if (totalSpan) totalSpan.textContent = `${highlightedQuotes.length} / ${quotes.length}개`;
  } else {
    renderSearchResults();
  }
}

sortBtn.onclick = () => {
  sortMode = sortMode === "newest" ? "oldest" : sortMode === "oldest" ? "popular" : "newest";

  if (existing) existing.remove();

  overlay.innerHTML = `

        <button class="custom-alert-btn confirm">확인</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  overlay.querySelector('.cancel').addEventListener('click', () => closeConfirm(false));
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeConfirm(false);
  });
}

function highlightText(text, rawKeyword) {
  if (!rawKeyword || !text) return text;

  const keyword = rawKeyword.replace(/\s+/g, "").toLowerCase();
  if (!keyword) return text;

  let result = "";
  let textIndex = 0;

  while (textIndex < text.length) {
    let k = 0;
    let t = textIndex;
    let matchStart = -1;

    while (t < text.length) {
      if (text[t] === " ") { t++; continue; }

      if (text[t].toLowerCase() === keyword[k]) {
        if (k === 0) matchStart = t;
        k++;
        if (k === keyword.length) break;
      } else if (k > 0) {
        k = 0;
        matchStart = -1;
      }
      t++;
    }

    if (k === keyword.length && matchStart !== -1) {
      result += text.slice(0, matchStart) +
                "<mark>" + text.slice(matchStart, t + 1) + "</mark>";
      text = text.slice(t + 1);
      textIndex = 0;
    } else {
      result += text;
      break;
    }
  }

  const words = rawKeyword
    .split(" ")
    .map(w => w.trim())
    .filter(w => w.length > 0);

  words.forEach(word => {
    const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const regex = new RegExp(`(?![^<]*>)(${escaped})`, "gi");
    result = result.replace(regex, "<mark>$1</mark>");
  });

  return result;
}

function updateTotalCount(currentLength = quotes.length) {
  const totalSpan = document.getElementById("totalQuotes");
  if (!totalSpan) return;

  if (showingLiked) {
    totalSpan.textContent = `${currentLength} / ${quotes.length}개`;
  } else {
    totalSpan.textContent = `총 ${quotes.length}개`;
  }
}

function applyMarkdown(text) {
  if (!text) return text;
  text = text.replace(/\*\*\*(.+?)\*\*\*/g, "<b><i>$1</i></b>");
  text = text.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  text = text.replace(/\*(.+?)\*/g, "<i>$1</i>");
  text = text.replace(/~(.+?)~/g, "<s>$1</s>");
  return text;
}

function isBlockedCp(tag) {
  tag = tag.replace(/^#/, "");
  for (let r of blockedCpRules) {
    if (r.rule === "startsWith" && tag.startsWith(r.name)) return true;
    if (r.rule === "endsWith" && tag.endsWith(r.name)) return true;
    if (r.rule === "exact" && tag === r.name) return true;
  }
  return false;
}

function getAllTags() {
  if (tagCache) return tagCache;
  const tagSet = new Set();
  quotes.forEach(q => (q.cpTags || []).forEach(t => tagSet.add(t)));
  tagCache = Array.from(tagSet).sort((a, b) => a.localeCompare(b, "ko"));
  return tagCache;
}

function setupTagAutocomplete(inputEl, boxEl) {
  if (!inputEl || !boxEl) return;

  function currentSegment() {
    const parts = inputEl.value.split(",");
    return parts[parts.length - 1].trim();
  }

  function closeBox() { boxEl.classList.remove("active"); boxEl.innerHTML = ""; }

  function pickTag(tag) {
    const parts = inputEl.value.split(",");
    parts[parts.length - 1] = " " + tag;
    inputEl.value = parts.map(p => p.trim()).filter(Boolean).join(", ") + ", ";
    closeBox();
    inputEl.focus();
  }

  inputEl.addEventListener("input", () => {
    const seg = currentSegment();
    if (!seg) { closeBox(); return; }

    const matches = getAllTags()
      .filter(t => t.toLowerCase().includes(seg.toLowerCase()))
      .slice(0, 8);

    if (matches.length === 0) { closeBox(); return; }

    boxEl.innerHTML = matches
      .map(t => `<div class="tag-suggestion-item">${t}</div>`)
      .join("");
    boxEl.classList.add("active");
  });

  boxEl.addEventListener("mousedown", (e) => {
    const item = e.target.closest(".tag-suggestion-item");
    if (!item) return;
    e.preventDefault();
    pickTag(item.textContent);
  });

  const onDocClick = (e) => {
    if (e.target !== inputEl && !boxEl.contains(e.target)) closeBox();
  };
  document.addEventListener("click", onDocClick);

  return () => document.removeEventListener("click", onDocClick);
}

function canModify(quote) {
  if (!window.__fb) return false;
  if (window.__fb.isAdmin()) return true;
  const myUid = window.__fb.getUid();

function copyQuoteText(text) {
  const tempDiv = document.createElement("div");
  tempDiv.innerHTML = text;
  const cleanText = tempDiv.textContent || tempDiv.innerText || "";

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(cleanText).then(() => {
      showAlert("명대사가 복사되었습니다.");
    }).catch(() => {
      fallbackCopyText(cleanText);
    });
  } else {
    fallbackCopyText(cleanText);
  }
}

function fallbackCopyText(text) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  document.body.appendChild(textArea);
  textArea.select();
  try {
    document.execCommand("copy");
    showAlert("명대사가 복사되었습니다.");
  } catch (err) {
    showAlert("복사에 실패했습니다.");
  }
  document.body.removeChild(textArea);
}

function createCommentSection(index) {

  commentSection.appendChild(commentNameInput);

  const commentInput = document.createElement("textarea");
  commentInput.className = "commentInput";
  commentInput.placeholder = "댓글 입력";
  commentInput.spellcheck = false;
  commentSection.appendChild(commentInput);

  const commentBtn = document.createElement("button");
  commentBtn.className = "commentAddBtn";
  commentBtn.textContent = "댓글 추가";
  commentBtn.onclick = (e) => {
    e.stopPropagation(); 
    const authorName = commentNameInput.value.trim();
    addComment(index, commentInput.value, commentList, authorName); 
    commentInput.value = "";
    if (authorName) localStorage.setItem("lastCommentName", authorName);

function addComment(index, text, listDiv, authorName) {
  text = text.trim();
  if (!text) return;
  const comment = { text, time: new Date().toLocaleString() };
  if (authorName) comment.author = authorName;
  const quote = quotes[index];
  if (!quote.comments) quote.comments = [];
  quote.comments.push(comment);

  window.__fb.updateQuote(quote.id, { comments: quote.comments }).catch(err => {
    console.error(err);
    showAlert("댓글 등록에 실패했어요.");
  });

  displayComments(quote.comments, listDiv);
  updateQuoteElement(index);
}

  listDiv.innerHTML = "";
  comments.forEach((c) => {
    const div = document.createElement("div");
    div.className = "comment";
    const authorLabel = c.author ? `${c.author} · ` : "";

function toggleLike(index, btn) {
  const quote = quotes[index];
  const id = quote.id;
  if (likedQuotes.includes(id)) {
    likedQuotes = likedQuotes.filter(qid => qid !== id);
    btn.classList.remove("liked");
    quote.likes = Math.max(0, (quote.likes || 0) - 1);
    window.__fb.unlikeQuote(id).catch(err => console.error(err));
  } else {
    likedQuotes.push(id);
    btn.classList.add("liked");
    quote.likes = (quote.likes || 0) + 1;
    window.__fb.likeQuote(id).catch(err => console.error(err));

    for (let i = 0; i < 3; i++) {
      const particle = document.createElement("span");
      particle.className = "likeParticle";
      particle.textContent = "♥";
      particle.style.setProperty("--x", (Math.random() * 40 - 20) + "px");
      particle.style.setProperty("--y", (-Math.random() * 35 - 15) + "px");
      btn.appendChild(particle);
      setTimeout(() => particle.remove(), 700);
    }
  }

  saveData();
  updateQuoteElement(index);

  if (showingLiked) {
    let filtered = getLikedFilteredQuotes();
    filtered = sortQuoteList(filtered);
    displayFilteredQuotes(filtered);
  }
}

    showAlert("좋아요한 명대사가 없습니다.");

function addQuote() {
  if (!window.__fb || !window.__fb.getUid()) {
    showAlert("서버 연결 중입니다. 잠시 후 다시 시도해주세요.");
    return;
  }

  const addBtn = document.getElementById("addQuoteBtn");
  if (addBtn && addBtn.disabled) return;

  const userId = document.getElementById("userId").value.trim();
  const pota   = document.getElementById("potaName").value.trim();
  const text   = document.getElementById("quoteText").value.trim();
  const tags   = document.getElementById("tagsInput").value
                   .split(",")
                   .map(t => t.trim())
                   .filter(Boolean);
  const font   = DEFAULT_FONT;

  if (!pota || !text || !userId) {
    showAlert("작품명과 명대사, 작가명을 모두 입력하세요.");
    return;
  }

  for (let t of tags) {
    if (isBlockedCp(t)) {
      showAlert(`차단된 CP 태그: ${t}`);
      return;
    }
  }

  const existingTexts = quotes.map(q => q.text);
  if (isExactDuplicate(text, existingTexts)) {
    showAlert("⚠️ 이미 완전히 동일한 문장이 존재합니다.");
    return;
  }

  const time = new Date().toLocaleString();

  window.__fb.addQuote({
    userId,
    pota,
    text,
    cpTags: tags,
    font,
    likes: 0,
    comments: [],
    time,
    createdAt: Date.now(),
    ownerId: window.__fb.getUid(),
  }).then(() => {
    startAddQuoteCooldown(8);
  }).catch(err => {
    console.error(err);
    if (err && err.code === "permission-denied") {
      showAlert("너무 빠르게 여러 번 올리고 있어요. 잠시 후 다시 시도해주세요.");
      startAddQuoteCooldown(8);
    } else {
      showAlert("저장에 실패했어요. 인터넷 연결을 확인해주세요.");
    }
  });

  document.getElementById("potaName").value = "";
  document.getElementById("quoteText").value = "";
  document.getElementById("tagsInput").value = "";
  document.getElementById("userId").value = "";

  showAlert("명대사가 추가되었습니다.");

  showingLiked = false;
  showingHighlight = false;
  renderSearchResults();

  updateCharCounter();
  draftInputs.forEach(id => localStorage.removeItem("draft_" + id));
}

function startAddQuoteCooldown(seconds) {
  const addBtn = document.getElementById("addQuoteBtn");
  if (!addBtn) return;
  let remaining = seconds;
  addBtn.disabled = true;
  const originalText = "추가";
  addBtn.textContent = `${remaining}초 후 가능`;
  const timer = setInterval(() => {
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(timer);
      addBtn.disabled = false;
      addBtn.textContent = originalText;
    } else {
      addBtn.textContent = `${remaining}초 후 가능`;
    }
  }, 1000);
}

function extractQuotedText(sentence) {
  if (typeof sentence !== "string") return null;
  const match = sentence.match(/[“"]([^”"]+)[”"]/s);
  return match ? match[1].trim() : null;
}

function normalizePlainSentence(sentence) {
  if (typeof sentence !== "string") return "";
  return sentence.trim().replace(/[.,!?]+$/, "");
}

function isExactDuplicate(newSentence, existingSentences) {
  const newQuoted = extractQuotedText(newSentence);
  const normalizedNewPlain = normalizePlainSentence(newSentence);

  return existingSentences.some(existing => {
    const existingQuoted = extractQuotedText(existing);

    if (newQuoted && existingQuoted) {
      return newQuoted === existingQuoted;
    }

    if (!newQuoted && !existingQuoted) {
      return (
        normalizedNewPlain ===
        normalizePlainSentence(existing)
      );
    }

    return false;
  });
}

function deleteQuote(index) {

    likedQuotes = likedQuotes.filter(qid => qid !== id);
    saveData();

function prepareHighlightsForCapture(cardDiv) {
  const marks = cardDiv.querySelectorAll(".manual-highlight");
  const overlays = [];
  const hadZIndex = cardDiv.style.zIndex;
  if (marks.length === 0) return { overlays, hadZIndex, applied: false };

  cardDiv.style.zIndex = "0";
  const cardRect = cardDiv.getBoundingClientRect();

  marks.forEach(mark => {
    mark.classList.add("capture-hide-bg");
    Array.from(mark.getClientRects()).forEach(rect => {
      const box = document.createElement("div");
      box.className = "highlight-capture-overlay";
      Object.assign(box.style, {
        position: "absolute",
        left: (rect.left - cardRect.left) + "px",
        top: (rect.top - cardRect.top) + "px",
        width: rect.width + "px",
        height: rect.height + "px"
      });
      cardDiv.appendChild(box);
      overlays.push(box);
    });
  });

  return { overlays, hadZIndex, applied: true };
}

function restoreHighlightsForCapture(cardDiv, fix) {
  if (!fix || !fix.applied) return;
  fix.overlays.forEach(el => el.remove());
  cardDiv.querySelectorAll(".manual-highlight.capture-hide-bg")
    .forEach(mark => mark.classList.remove("capture-hide-bg"));
  cardDiv.style.zIndex = fix.hadZIndex || "";
}

let html2canvasPromise = null;
function loadHtml2Canvas() {
  if (window.html2canvas) return Promise.resolve(window.html2canvas);
  if (!html2canvasPromise) {
    html2canvasPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
      s.onload = () => resolve(window.html2canvas);
      s.onerror = () => { html2canvasPromise = null; reject(new Error("html2canvas 로딩 실패")); };
      document.head.appendChild(s);
    });
  }
  return html2canvasPromise;
}

function openShareModal(cardDiv) {
  const hideTargets = cardDiv.querySelectorAll(".editBtn, .deleteBtn, .shareBtn, .copyBtn");
  hideTargets.forEach(el => el.style.display = "none");

  const overlay = document.createElement("div");
  overlay.className = "shareOverlay";

  const modal = document.createElement("div");
  modal.className = "shareModal";
  modal.innerHTML = `
    <h3>명대사 공유</h3>
    <div class="sharePreview">이미지 생성 중...</div>
    <div class="shareActions">
      <button class="saveImgBtn">이미지 저장</button>
      <button class="closeShareBtn">닫기</button>
    </div>
  `;

  document.body.appendChild(overlay);
  document.body.appendChild(modal);

  function restoreButtons() {
    hideTargets.forEach(el => el.style.display = "");
  }

  function closeModal() {
    restoreButtons();
    overlay.remove();
    modal.remove();
  }

  overlay.onclick = closeModal;
  modal.querySelector(".closeShareBtn").onclick = closeModal;

  let highlightFix = null;

  loadHtml2Canvas().then(h2c => {
    highlightFix = prepareHighlightsForCapture(cardDiv);
    return h2c(cardDiv, {
      backgroundColor: "#ffffff",
      scale: 2
    });
  }).then(canvas => {
    restoreHighlightsForCapture(cardDiv, highlightFix);
    const imgUrl = canvas.toDataURL("image/png");
    modal.querySelector(".sharePreview").innerHTML = `<img src="${imgUrl}">`;

    modal.querySelector(".saveImgBtn").onclick = () => {
      const a = document.createElement("a");
      a.href = imgUrl;
      a.download = "quote_card.png";
      a.click();
    };

    restoreButtons();
  }).catch(() => {
    restoreHighlightsForCapture(cardDiv, highlightFix);
    restoreButtons();
    modal.querySelector(".sharePreview").textContent = "이미지 생성에 실패했습니다.";
  });
}

function searchQuotes() {
  const raw = document.getElementById("potaInput").value.toLowerCase().trim();

  if (raw) {
    const history = JSON.parse(localStorage.getItem("searchHistory") || "[]");
    history.push(raw.replace(/\s+/g, ""));
    localStorage.setItem("searchHistory", JSON.stringify(history));
  }

  renderSearchResults();
}

function renderSearchResults() {
  const raw = document.getElementById("potaInput").value.toLowerCase().trim();

  if (!raw) {
    displayFilteredQuotes(sortQuoteList(quotes));
    updateTotalCount();
    return;
  }

  const minusParts = raw.split("-").map(v => v.trim()).filter(Boolean);
  const base = minusParts[0] || "";
  const excludes = minusParts.slice(1).map(v => v.replace(/\s+/g, ""));

  window.__highlightKeyword = base;

  const orParts = base.split("|").map(v => v.trim()).filter(Boolean);
  const andParts = orParts.map(p =>
    p.split(/\s+/).map(v => v.trim()).filter(Boolean)
  );

  let filtered = quotes.filter(q => {
    const pota = (q.pota || "").toLowerCase();
    const text = (q.text || "").toLowerCase();
    const tags = (q.cpTags || []).join(" ").toLowerCase();
    const user = (q.userId || "").toLowerCase();

    const allText = (pota + text + tags + user).replace(/\s+/g, "");

    for (let ex of excludes) {
      if (allText.includes(ex)) return false;
    }

    return andParts.some(group =>
      group.every(word => allText.includes(word.replace(/\s+/g, "")))
    );
  });

  filtered = sortQuoteList(filtered);

  displayFilteredQuotes(filtered);

  const totalSpan = document.getElementById("totalQuotes");
  if (totalSpan) {
    totalSpan.textContent = `${filtered.length} / ${quotes.length}개`;
  }
}

function handleHighlightButton() {
  const selection = window.getSelection();

  if (selection && selection.rangeCount > 0 && !selection.isCollapsed) {
    const range = selection.getRangeAt(0);
    const container = range.commonAncestorContainer;
    const quoteEl = container.nodeType === 3
      ? container.parentElement.closest(".quote")
      : container.closest?.(".quote");

    if (!quoteEl) {
      showAlert("명대사 카드 안에서만 하이라이트할 수 있습니다.");
      selection.removeAllRanges();
      return;
    }

    const index = Number(quoteEl.dataset.index);
    const textEl = quoteEl.querySelector(".quote-text");
    const targetQuote = quotes[index];

    if (!canModify(targetQuote)) {
      showAlert("이 명대사는 작성자 또는 관리자만 하이라이트를 편집할 수 있어요.");
      selection.removeAllRanges();
      return;
    }

    if (!textEl.contains(range.commonAncestorContainer)) {
      selection.removeAllRanges();
      return;
    }

    let startContainer = range.startContainer;
    let parentMark = startContainer.nodeType === 3
      ? startContainer.parentElement.closest("mark.manual-highlight")
      : startContainer.closest?.("mark.manual-highlight");

    if (parentMark) {
      const parent = parentMark.parentNode;
      while (parentMark.firstChild) parent.insertBefore(parentMark.firstChild, parentMark);
      parent.removeChild(parentMark);
    } else {
      const mark = document.createElement("mark");
      mark.className = "manual-highlight";
      mark.appendChild(range.extractContents());
      range.insertNode(mark);

      requestAnimationFrame(() => {
        mark.classList.add("animate");
        setTimeout(() => mark.classList.remove("animate"), 400);
      });
    }

    selection.removeAllRanges();
    targetQuote.text = textEl.innerHTML;
    window.__fb.updateQuote(targetQuote.id, { text: targetQuote.text }).catch(err => {
      console.error(err);
      showAlert("하이라이트 저장에 실패했어요.");
    });
    showingHighlight = false;
  } else {
    if (showingHighlight) {
      showingHighlight = false;
      renderSearchResults();
      return;
    }

    let highlightedQuotes = quotes.filter(q => q.text.includes("manual-highlight"));

    if (highlightedQuotes.length === 0) {
      showAlert("하이라이트한 명대사가 없습니다.");
      return;
    }

    showingHighlight = true;
    showingLiked = false;
    highlightedQuotes = sortQuoteList(highlightedQuotes);
    displayFilteredQuotes(highlightedQuotes);

    const totalSpan = document.getElementById("totalQuotes");
    if (totalSpan) {
      totalSpan.textContent = `${highlightedQuotes.length} / ${quotes.length}개`;
    }
  }
}

function updateQuoteElement(index) {
  const listDiv = document.getElementById("quotesList");
  const div = listDiv.querySelector(`.quote[data-index='${index}']`);
  if (!div) return;

  const quote = quotes[index];
  const userDisplay = quote.userId ? `(${quote.userId})` : "";

  let titleText = `${quote.pota}${userDisplay ? ` ${userDisplay}` : ""}`;
  if (quote.comments && quote.comments.length > 0) {
    titleText += ` <span class="commentCount">💬 <span class="commentNumber">${quote.comments.length}</span></span>`;
  }
  div.querySelector(".quote-title").innerHTML = titleText;

  const processedText = applyMarkdown(quote.text);
  const textEl = div.querySelector(".quote-text");
  textEl.innerHTML = processedText;
  textEl.style.fontFamily = DEFAULT_FONT;

  const oldTags = div.querySelector(".tags");
  if (oldTags) oldTags.remove();

  if (quote.cpTags && quote.cpTags.length > 0) {
    const tagsDiv = document.createElement("div");
    tagsDiv.className = "tags";

    quote.cpTags.forEach(tag => {
      const span = document.createElement("span");
      span.className = "tag";
      span.textContent = tag;
      span.onclick = (e) => {
        e.stopPropagation();
        searchByTag(tag);
      };
      tagsDiv.appendChild(span);
    });

    div.appendChild(tagsDiv);
  }

  const commentSection = div.querySelector(".commentSection");
  if (commentSection) {
    const commentList = commentSection.querySelector("div");
    displayComments(quote.comments || [], commentList);
  }

  const likeBtn = div.querySelector(".likeBtn");
  if (likeBtn) {
    const countSpan = likeBtn.querySelector(".likeCount");
    if (countSpan) countSpan.textContent = Math.max(0, quote.likes || 0);
    if (likedQuotes.includes(quote.id)) {
      likeBtn.classList.add("liked");
    } else {
      likeBtn.classList.remove("liked");
    }
  }
}

const floatHlBtn = document.getElementById("floatHighlightBtn");
const floatHlMQ = window.matchMedia("(max-width: 768px)");
let floatHlRange = null;
let floatHlPressing = false;
let floatHlHideTimer = null;

function showFloatHl() {
  clearTimeout(floatHlHideTimer);
  floatHlHideTimer = null;
  if (!floatHlVisible) {
    floatHlVisible = true;
    floatHlBtn.classList.add("show");
  }
}

function hideFloatHl() {
  clearTimeout(floatHlHideTimer);
  floatHlHideTimer = null;
  floatHlBtn.classList.remove("show");
  floatHlVisible = false;
  floatHlRange = null;
  if (renderDeferred) { renderDeferred = false; scheduleRender(); }
}

function scheduleHideFloatHl() {
  if (!floatHlVisible || floatHlPressing || floatHlHideTimer) return;
  floatHlHideTimer = setTimeout(() => {
    floatHlHideTimer = null;
    if (!floatHlPressing) hideFloatHl();
  }, 250);
}

function evaluateFloatHl() {
  if (!floatHlMQ.matches) { if (floatHlVisible) hideFloatHl(); return; }

  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) { scheduleHideFloatHl(); return; }

  const range = sel.getRangeAt(0);
  const node = range.commonAncestorContainer;
  const el = node.nodeType === 3 ? node.parentElement : node;
  const textEl = el && el.closest ? el.closest(".quote-text") : null;
  if (!textEl) { scheduleHideFloatHl(); return; }

  const card = textEl.closest(".quote");
  const q = card ? quotes[Number(card.dataset.index)] : null;
  if (!q || !canModify(q)) { scheduleHideFloatHl(); return; }

  floatHlRange = range.cloneRange();
  showFloatHl();
}

document.addEventListener("selectionchange", evaluateFloatHl);

floatHlBtn.addEventListener("pointerdown", (e) => {
  floatHlPressing = true;
  clearTimeout(floatHlHideTimer);
  floatHlHideTimer = null;
  e.preventDefault();
});
floatHlBtn.addEventListener("mousedown", (e) => e.preventDefault());
floatHlBtn.addEventListener("pointercancel", () => { floatHlPressing = false; });
floatHlBtn.addEventListener("pointerup", () => { setTimeout(() => { floatHlPressing = false; }, 300); });

floatHlBtn.addEventListener("click", (e) => {
  e.preventDefault();
  e.stopPropagation();
  floatHlPressing = false;

  const range = floatHlRange;
  hideFloatHl();
  if (!range || !range.commonAncestorContainer.isConnected) return;

  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  handleHighlightButton();
});

function exportData() {

    return;
  }

  showConfirm("현재 저장된 명대사를 즉시 백업하시겠습니까?\n(기존 백업 데이터가 있다면 덮어씁니다)", () => {
    const backupData = {
      quotes: quotes,
      likedQuotes: likedQuotes,
      savedAt: new Date().toLocaleString()
    };

    localStorage.setItem("quote_quick_backup", JSON.stringify(backupData));
    showAlert(`성공적으로 백업되었습니다!\n(백업 시각: ${backupData.savedAt})`);
  });
}

function importData() {
  if (!window.__fb || !window.__fb.isAdmin()) {
    showAlert("데이터 복구는 관리자만 할 수 있어요.");
    return;
  }

  const savedBackup = localStorage.getItem("quote_quick_backup");

  if (!savedBackup) {
    showAlert("저장된 백업 데이터가 없습니다.\n먼저 [💾 백업] 버튼을 눌러 데이터를 백업해 주세요.");
    return;
  }

  try {
    const parsed = JSON.parse(savedBackup);
    const backupQuotes = parsed.quotes || [];
    const backupLiked = parsed.likedQuotes || [];
    const savedAt = parsed.savedAt || "알 수 없음";

    showConfirm(`백업된 명대사 ${backupQuotes.length}개(백업 시각: ${savedAt})를 지금 사이트에 새 글로 추가하시겠습니까?\n(기존 명대사는 지워지지 않고, 백업분이 추가로 더해집니다)`, async () => {
      let successCount = 0;
      for (const q of backupQuotes) {
        const { id, ...rest } = q;
        try {
          await window.__fb.addQuote({ ...rest, ownerId: window.__fb.getUid() });
          successCount++;
        } catch (e) {
          console.error(e);
        }
      }
      likedQuotes = backupLiked;
      saveData();
      showAlert(`백업된 명대사 ${successCount}개가 추가되었습니다!`);
    });
  } catch (err) {
    showAlert("백업 데이터를 불러오는 중 오류가 발생했습니다.");
  }
}

const quoteTextarea = document.getElementById("quoteText");
const charCounter = document.getElementById("charCounter");

function updateCharCounter() {
  const length = quoteTextarea.value.length;
  charCounter.textContent = `${length}자`;

  if (length > 300) {
    charCounter.style.color = "#e63946";
  } else if (length > 150) {
    charCounter.style.color = "#f4a261";
  } else {
    charCounter.style.color = "#666";
  }
}

quoteTextarea.addEventListener("input", updateCharCounter);
updateCharCounter();

const draftInputs = ["userId", "potaName", "quoteText", "tagsInput"];

draftInputs.forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;

  el.addEventListener("input", () => {
    localStorage.setItem("draft_" + id, el.value);
  });
});

window.addEventListener("load", () => {
  draftInputs.forEach(id => {
    const el = document.getElementById(id);
    const saved = localStorage.getItem("draft_" + id);
    if (el && saved) el.value = saved;
  });
  renderSearchResults();
});
</script>
</body>
